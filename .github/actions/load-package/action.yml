name: Load verified Securefix package
description: Verify the immutable package mapping bundled with this action and add the verified binary to PATH
inputs:
  token:
    description: Read-only token for the package source and destination repositories
    required: true
outputs:
  binary:
    description: Verified executable path
    value: ${{ steps.load.outputs.binary }}
  version:
    description: Verified package version
    value: ${{ steps.load.outputs.version }}
  asset-id:
    description: Verified immutable release asset ID
    value: ${{ steps.load.outputs.asset-id }}
  release-id:
    description: Verified immutable release ID
    value: ${{ steps.load.outputs.release-id }}
  source-sha:
    description: Verified binary source revision
    value: ${{ steps.load.outputs.source-sha }}
  source-branch:
    description: Verified binary source branch
    value: ${{ steps.load.outputs.source-branch }}
  producer-run-id:
    description: Verified producer workflow run ID
    value: ${{ steps.load.outputs.producer-run-id }}
  producer-run-attempt:
    description: Verified producer workflow run attempt
    value: ${{ steps.load.outputs.producer-run-attempt }}
runs:
  using: composite
  steps:
    - id: load
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const { join } = await import('node:path');
          const { pathToFileURL } = await import('node:url');
          const actionPath = process.env.GITHUB_ACTION_PATH;
          if (typeof actionPath !== 'string' || actionPath.length === 0) {
            throw new Error('composite action path is unavailable');
          }
          const entryUrl = pathToFileURL(join(actionPath, 'entry.mts')).href;
          const entry = await import(entryUrl);
          await entry.run({ github, context, core, exec });
