name: Load verified runtime
description: Locate, attest, and verify a source-bound published runtime
inputs:
  repository:
    description: Repository that publishes the runtime
    required: true
  default-branch:
    description: Publisher branch required by the attestation
    required: true
  token:
    description: Read-only token for runtime contents, action runs, and attestations
    required: true
outputs:
  directory:
    description: Directory containing the verified runtime
    value: ${{ steps.load.outputs.directory }}
  source-sha:
    description: Active runtime source commit SHA
    value: ${{ steps.load.outputs.source-sha }}
  control-id:
    description: Canonical identity of the active control descriptor
    value: ${{ steps.load.outputs.control-id }}
  main-sha:
    description: Immutable main revision from which the descriptor was read
    value: ${{ steps.load.outputs.main-sha }}
runs:
  using: composite
  steps:
    - id: load
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.token }}
        REPOSITORY: ${{ inputs.repository }}
        DEFAULT_BRANCH: ${{ inputs.default-branch }}
      run: bash "$ACTION_PATH/load.sh"
