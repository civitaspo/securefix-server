name: Approve Request

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  issue_comment:
    types:
      - created

permissions: {}

concurrency:
  group: approve-request-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  approve:
    name: approve
    uses: ./.github/workflows/reusable-approve-request.yml
    with:
      # SECUREFIX_CLIENT_PRIVATE_KEY lives on the main environment; the reusable
      # job selects that environment so inherit can resolve the secret.
      require_main_environment: true
    secrets: inherit
