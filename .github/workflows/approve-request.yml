name: Approve Request

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  issue_comment:
    types:
      - created

permissions: {}

concurrency:
  group: approve-request-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  approve:
    name: approve
    if: |
      (
        github.event_name == 'pull_request_target' &&
        contains(fromJSON('["civitaspo", "renovate[bot]", "dependabot[bot]", "civitaspo-securefix-server[bot]"]'), github.actor)
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.body == '/approve' &&
        github.event.comment.user.login == 'civitaspo'
      )
    runs-on: ubuntu-latest
    # SECUREFIX_CLIENT_PRIVATE_KEY lives on the main environment (with other
    # strong secrets), so this job must select that environment. Client repos
    # call reusable-approve-request.yml instead (repo secret, no environment).
    environment: main
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10

    steps:
      - name: Request pull request approval
        uses: csm-actions/approve-pr-action@a8fdc60ab4d9b446694140534bbcc71c29fb499c # v1.0.0
        with:
          # Keep app id / server name / allowed_committers aligned with
          # reusable-approve-request.yml and approve.yml.
          app_id: "3872492"
          app_private_key: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
          server_repository_name: securefix-server
          pull_request_number: ${{ github.event.pull_request.number || github.event.issue.number }}
          allowed_committers: |
            civitaspo
            cursoragent
            civitaspo-securefix-server[bot]
            renovate[bot]
            dependabot[bot]
