name: Build CLI
on:
  workflow_call:
    outputs:
      artifact-id:
        description: Immutable artifact ID of the trusted runtime
        value: ${{ jobs.build.outputs.artifact-id }}
      source-sha:
        description: Immutable commit of the trusted runtime
        value: ${{ jobs.build.outputs.source-sha }}
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      source-sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          repository: civitaspo/securefix-server
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-cli
      - name: Assemble runtime artifact
        run: |
          install -Dm755 target/release/securefix runtime/securefix
          cp policy.json runtime/policy.json
          cp -R repo-settings runtime/repo-settings
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: securefix-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/
          if-no-files-found: error
          retention-days: 1
