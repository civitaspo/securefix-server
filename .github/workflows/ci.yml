name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: GitHub Actions
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: read
      contents: read
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: $/.github/actions/install-actions-lock

      - name: Verify workflow dependency lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh-actions-lock --verify

      - name: Check and test the package loader on Node.js 24
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { join } = await import('node:path');
            const tests = join(process.env.GITHUB_WORKSPACE, '.github/actions/load-package/tests');
            await exec.exec('npm', ['ci', '--ignore-scripts', '--no-audit', '--no-fund'], { cwd: tests });
            await exec.exec(process.execPath, [join(tests, 'node_modules/typescript/bin/tsc'), '--project', join(tests, 'tsconfig.json')]);
            await exec.exec(process.execPath, ['--test', join(tests, 'load.test.mts')]);

      - name: Load the bundled package through the composite Action
        id: loader-smoke
        uses: $/.github/actions/load-package
        with:
          token: ${{ github.token }}

      - name: Verify the installed package command and outputs
        env:
          CLI_BINARY: ${{ steps.loader-smoke.outputs.binary }}
          CLI_VERSION: ${{ steps.loader-smoke.outputs.version }}
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          test "$(command -v securefix)" = "$CLI_BINARY"
          test "$("$CLI_BINARY" --version)" = "securefix $CLI_VERSION"

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt

      - name: Check formatting
        run: cargo +1.99.0 fmt --all -- --check

      - name: Run Rust tests
        run: cargo +1.99.0 test --locked

      - name: Run Clippy
        run: cargo +1.99.0 clippy --locked --all-targets -- -D warnings

      - uses: $/.github/actions/setup-cli
        id: build-cli

      - name: Require a runtime version bump over the pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          base_manifest="$RUNNER_TEMP/securefix-base-Cargo.toml"
          git show "$BASE_SHA:Cargo.toml" > "$base_manifest"
          changed_files="$RUNNER_TEMP/securefix-changed-files"
          git diff --name-only -z --no-renames "$BASE_SHA" HEAD > "$changed_files"
          "${{ steps.build-cli.outputs.binary }}" runtime check-version --base-manifest "$base_manifest" --changed-files "$changed_files"

      - uses: $/.github/actions/install-cli
        with:
          binary: ${{ steps.build-cli.outputs.binary }}

      - name: Verify release executable
        run: securefix runtime publish --help

      - name: Run actionlint
        env:
          GOTOOLCHAIN: go1.26.5
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          -shellcheck=
          -ignore 'unexpected key "queue" for "concurrency" section. expected one of "cancel-in-progress", "group"'
          -ignore 'property "workflow_sha" is not defined in object type \{check_run_id: number; container:|specifying action "\$/\.github/actions/(install-cli|load-runtime|setup-cli|install-actions-lock|load-package)" in invalid format because ref is missing'

      - name: Publish reusable CLI build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: cli-artifact
        with:
          name: securefix-cli-ubuntu-24.04-x64-rust-1.99.0-${{ github.sha }}
          path: |
            target/release/securefix
            target/release/policy.json
          if-no-files-found: error
          retention-days: 7

      - name: Record reusable CLI provenance
        if: steps.cli-artifact.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.cli-artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.cli-artifact.outputs.artifact-digest }}
        run: |
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "runner=ubuntu-24.04/x64; rust=1.99.0; cargo=--locked --release --bin securefix" >> "$GITHUB_STEP_SUMMARY"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "artifact_digest=$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  status-check:
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 10
    permissions: {}
    needs:
      - workflows
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo 'Required checks passed.'
