name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: GitHub Actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt

      - name: Check formatting
        run: cargo +1.99.0 fmt --all -- --check

      - name: Run Rust tests
        run: cargo +1.99.0 test --locked

      - name: Run Clippy
        run: cargo +1.99.0 clippy --locked --all-targets -- -D warnings

      - uses: ./.github/actions/setup-cli
        id: build-cli

      - uses: $/.github/actions/install-cli
        with:
          binary: ${{ steps.build-cli.outputs.binary }}

      - name: Verify release executable
        run: securefix runtime publish --help

      - name: Run actionlint
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          -shellcheck=
          -ignore 'property "workflow_sha" is not defined in object type \{check_run_id: number; container:|specifying action "\$/\.github/actions/install-cli" in invalid format because ref is missing'

  status-check:
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 10
    permissions: {}
    needs:
      - workflows
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo 'Required checks passed.'
