name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: GitHub Actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt

      - name: Check formatting
        run: cargo +1.99.0 fmt --all -- --check

      - name: Run Rust tests
        run: cargo +1.99.0 test --locked

      - name: Run Clippy
        run: cargo +1.99.0 clippy --locked --all-targets -- -D warnings

      - uses: ./.github/actions/setup-cli
        id: build-cli

      - name: Require a runtime version bump over the pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          base_manifest="$RUNNER_TEMP/securefix-base-Cargo.toml"
          git show "$BASE_SHA:Cargo.toml" > "$base_manifest"
          changed_files="$RUNNER_TEMP/securefix-changed-files"
          git diff --name-only -z --no-renames "$BASE_SHA" HEAD > "$changed_files"
          "${{ steps.build-cli.outputs.binary }}" runtime check-version --base-manifest "$base_manifest" --changed-files "$changed_files"

      - uses: $/.github/actions/install-cli
        with:
          binary: ${{ steps.build-cli.outputs.binary }}

      - name: Verify release executable
        run: securefix runtime publish --help

      - name: Run actionlint
        env:
          GOTOOLCHAIN: go1.26.5
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          -shellcheck=
          -ignore 'unexpected key "queue" for "concurrency" section. expected one of "cancel-in-progress", "group"'
          -ignore 'property "workflow_sha" is not defined in object type \{check_run_id: number; container:|specifying action "\$/\.github/actions/(install-cli|load-runtime)" in invalid format because ref is missing'

  status-check:
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 10
    permissions: {}
    needs:
      - workflows
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo 'Required checks passed.'
