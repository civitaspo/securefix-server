name: Distribute Runtime
on:
  workflow_dispatch:
    inputs:
      publisher_run_id:
        description: Successful Publish Runtime run to retry
        required: true
        type: string
permissions: {}
jobs:
  runtime:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor_id == '4525500'
    uses: ./.github/workflows/load-cli.yml
    permissions:
      actions: read
      contents: read
      attestations: read
  gate:
    needs: runtime
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      callers: ${{ steps.validate.outputs.callers }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.runtime.outputs.artifact-id }}
          path: ${{ runner.temp }}/securefix-runtime
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        with:
          binary: ${{ runner.temp }}/securefix-runtime/securefix
      - id: validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          SECUREFIX_SOURCE_SHA: ${{ needs.runtime.outputs.source-sha }}
          SECUREFIX_CONTROL_ID: ${{ needs.runtime.outputs.control-id }}
          SECUREFIX_WORKFLOW_SHA: ${{ needs.runtime.outputs.workflow-sha }}
          PUBLISHER_RUN_ID: ${{ inputs.publisher_run_id }}
        run: securefix distribute validate-promotion "$PUBLISHER_RUN_ID"
  caller:
    if: github.ref == 'refs/heads/main' && github.actor_id == '4525500'
    needs: [runtime, gate]
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJSON(needs.gate.outputs.callers) }}
    runs-on: ubuntu-latest
    environment: main
    concurrency:
      group: securefix-control
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
    steps:
      - uses: $/.github/actions/install-actions-lock
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.runtime.outputs.artifact-id }}
          path: ${{ runner.temp }}/securefix-runtime
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        with:
          binary: ${{ runner.temp }}/securefix-runtime/securefix
      - id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SECUREFIX_SOURCE_SHA: ${{ needs.runtime.outputs.source-sha }}
          SECUREFIX_CONTROL_ID: ${{ needs.runtime.outputs.control-id }}
          SECUREFIX_WORKFLOW_SHA: ${{ needs.runtime.outputs.workflow-sha }}
        run: securefix distribute prepare-caller "${{ matrix.repository }}" "caller-migration"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: server-write-token
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: ${{ steps.prepare.outputs.repository_name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Apply signed caller migration and reconcile its pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_SERVER_TOKEN: ${{ steps.server-write-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          SECUREFIX_SOURCE_SHA: ${{ needs.runtime.outputs.source-sha }}
          SECUREFIX_CONTROL_ID: ${{ needs.runtime.outputs.control-id }}
          SECUREFIX_WORKFLOW_SHA: ${{ needs.runtime.outputs.workflow-sha }}
          PUBLISHER_RUN_ID: ${{ inputs.publisher_run_id }}
        run: >-
          securefix distribute apply-caller
          --repository "${{ matrix.repository }}"
          --directory caller-migration
          --publisher-run-id "$PUBLISHER_RUN_ID"
