name: Load CLI
on:
  workflow_call:
    outputs:
      artifact-id:
        description: Immutable artifact ID of the verified runtime
        value: ${{ jobs.load.outputs.artifact-id }}
      source-sha:
        description: Active source commit of the trusted runtime
        value: ${{ jobs.load.outputs.source-sha }}
      control-id:
        description: Canonical identity of the active control descriptor
        value: ${{ jobs.load.outputs.control-id }}
      workflow-sha:
        description: Immutable commit that defines this workflow job
        value: ${{ jobs.load.outputs.workflow-sha }}
permissions: {}
defaults:
  run:
    shell: bash -euo pipefail {0}
jobs:
  load:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      source-sha: ${{ steps.runtime.outputs.source-sha }}
      control-id: ${{ steps.runtime.outputs.control-id }}
      workflow-sha: ${{ job.workflow_sha }}
    steps:
      - name: Load source-bound attested runtime
        id: runtime
        uses: $/.github/actions/load-runtime
        with:
          repository: civitaspo/securefix-server
          default-branch: main
          token: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: securefix-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.runtime.outputs.directory }}/
          if-no-files-found: error
          retention-days: 1
