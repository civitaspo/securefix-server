name: Merge Request

on:
  issue_comment:
    types:
      - created

permissions: {}

concurrency:
  group: merge-request-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  request:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/merge') &&
      (github.event.comment.user.id == 4525500 ||
       (github.event.comment.user.id == 29139614 &&
        github.event.comment.user.type == 'Bot' &&
        github.event.issue.user.id == 29139614)) &&
      github.run_attempt == 1
    uses: ./.github/workflows/reusable-merge-request.yml
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
      issues: read
      pull-requests: read
    with:
      server_repository: civitaspo/securefix-server
      instance_config_path: securefix-server.toml
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
