name: Merge Pull Request
run-name: Merge Pull Request (${{ github.event.label.description }})

on:
  label:
    types:
      - created

permissions: {}

concurrency:
  group: merge-${{ github.event.label.description }}
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.event.label.name, 'merge-request-')
    uses: ./.github/workflows/load-cli.yml
    permissions:
      contents: read
      attestations: read

  merge:
    needs: build
    if: needs.build.result == 'success' && startsWith(github.event.label.name, 'merge-request-')
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    timeout-minutes: 70
    outputs:
      self_merged: ${{ steps.validate.outputs.repository == 'civitaspo/securefix-server' && steps.apply.outcome == 'success' }}
    env:
      SECUREFIX_SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/securefix-runtime
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        with:
          binary: ${{ runner.temp }}/securefix-runtime/securefix
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: read-token
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-statuses: read
      - name: Validate source proof and accepted head
        id: validate
        env:
          SECUREFIX_SERVER_TOKEN: ${{ steps.read-token.outputs.token }}
        run: securefix merge validate
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.validate.outcome == 'success'
        id: authorization-token
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: ${{ steps.validate.outputs.repository_name }}
          permission-checks: write
          permission-issues: write
          permission-pull-requests: write
      - name: Record owner authorization for the exact head
        id: authorize
        if: steps.validate.outcome == 'success'
        env:
          SECUREFIX_SERVER_TOKEN: ${{ steps.read-token.outputs.token }}
          SECUREFIX_AUTHORIZATION_TOKEN: ${{ steps.authorization-token.outputs.token }}
        run: securefix merge authorize
      - name: Wait for current checks and review approval
        id: wait
        if: steps.authorize.outcome == 'success'
        env:
          SECUREFIX_SERVER_TOKEN: ${{ steps.read-token.outputs.token }}
        run: securefix merge wait
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.wait.outcome == 'success'
        id: merge-token
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: ${{ steps.validate.outputs.repository_name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.wait.outcome == 'success' && steps.validate.outputs.repository == 'civitaspo/securefix-server'
        id: self-cleanup-token
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: securefix-server
          permission-issues: write
      - name: Consume the self-target request label before apply
        id: self-cleanup
        if: steps.wait.outcome == 'success' && steps.validate.outputs.repository == 'civitaspo/securefix-server'
        env:
          GITHUB_TOKEN: ${{ steps.self-cleanup-token.outputs.token }}
        run: securefix merge cleanup
      - name: Merge the accepted SHA
        id: apply
        if: steps.wait.outcome == 'success' && (steps.validate.outputs.repository != 'civitaspo/securefix-server' || steps.self-cleanup.outcome == 'success')
        env:
          SECUREFIX_SERVER_TOKEN: ${{ steps.read-token.outputs.token }}
          SECUREFIX_MERGE_TOKEN: ${{ steps.merge-token.outputs.token }}
        run: securefix merge apply
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: always() && steps.validate.outcome == 'success' && (steps.validate.outputs.repository != 'civitaspo/securefix-server' || steps.apply.outcome != 'success')
        id: notify-token
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: ${{ steps.validate.outputs.repository_name }}
          permission-issues: write
          permission-pull-requests: write
      - name: Report the terminal result
        if: always() && steps.validate.outcome == 'success' && steps.notify-token.outcome == 'success' && (steps.validate.outputs.repository != 'civitaspo/securefix-server' || steps.apply.outcome != 'success')
        env:
          SECUREFIX_NOTIFY_TOKEN: ${{ steps.notify-token.outputs.token }}
          SECUREFIX_MERGE_RESULT: ${{ steps.apply.outcome }}
          SECUREFIX_MERGE_SHA: ${{ steps.apply.outputs.merge_sha }}
        run: securefix merge notify

  cleanup:
    needs: [build, merge]
    if: always() && needs.build.result == 'success' && startsWith(github.event.label.name, 'merge-request-') && needs.merge.outputs.self_merged != 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 5
    env:
      SECUREFIX_SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/securefix-runtime
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        with:
          binary: ${{ runner.temp }}/securefix-runtime/securefix
      - name: Delete the one-time request label
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: securefix merge cleanup
