name: Merge Pull Request
run-name: Merge Pull Request (${{ github.event.label.name }})

on:
  label:
    types:
      - created

permissions: {}

concurrency:
  group: merge-request-${{ github.event.label.name }}
  cancel-in-progress: false

jobs:
  resolve:
    if: startsWith(github.event.label.name, 'merge-request-')
    runs-on: ubuntu-latest
    environment: main
    permissions:
      actions: read
      contents: read
    timeout-minutes: 10
    outputs:
      repository: ${{ steps.manifest.outputs.repository }}
      repository_name: ${{ steps.locator.outputs.repository_name }}
      number: ${{ steps.manifest.outputs.number }}
      manifest: ${{ steps.manifest.outputs.manifest }}
    steps:
      - name: Check out the repository allowlist
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: repo-settings/allowlist.json
          sparse-checkout-cone-mode: false
      - name: Resolve the source run locator
        id: locator
        shell: bash
        env:
          LABEL_NAME: ${{ github.event.label.name }}
          LABEL_DESCRIPTION: ${{ github.event.label.description }}
          SENDER_ID: ${{ github.event.sender.id }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          VERIFICATION_REPOSITORY: ${{ vars.MERGE_VERIFICATION_REPOSITORY }}
        run: |
          set -euo pipefail
          [[ "$LABEL_NAME" =~ ^merge-request-([0-9]+)$ ]] || { echo 'Invalid merge request label.' >&2; exit 1; }
          run_id="${BASH_REMATCH[1]}"
          [[ "$LABEL_DESCRIPTION" =~ ^civitaspo/([A-Za-z0-9._-]{1,100})/([0-9]+)$ ]] || { echo 'Invalid source run locator.' >&2; exit 1; }
          repository_name="${BASH_REMATCH[1]}"
          [[ "$run_id" == "${BASH_REMATCH[2]}" && "$RUN_ATTEMPT" == 1 && "$SENDER_ID" == 288068203 && "$SENDER_TYPE" == Bot ]] || { echo 'Untrusted or replayed merge request label.' >&2; exit 1; }
          repository="civitaspo/$repository_name"
          if ! jq -e --arg name "$repository_name" 'index($name) != null' repo-settings/allowlist.json >/dev/null && [[ -z "$VERIFICATION_REPOSITORY" || "$repository" != "$VERIFICATION_REPOSITORY" ]]; then
            echo "Merge requests are not enabled for $repository." >&2
            exit 1
          fi
          {
            echo "repository=$repository"
            echo "repository_name=$repository_name"
            echo "run_id=$run_id"
          } >> "$GITHUB_OUTPUT"
      - name: Reject a previously handled source request
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.locator.outputs.run_id }}
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          since="$(jq -nr 'now-86400|todateiso8601')"
          prior_runs="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/workflows/merge.yml/runs?event=label&created=%3E%3D$since&per_page=100" | jq -s '[.[].workflow_runs[]]')"
          expected_title="Merge Pull Request (merge-request-$SOURCE_RUN_ID)"
          if jq -e --argjson current "$CURRENT_RUN_ID" --arg title "$expected_title" 'any(.[]; .id != $current and .display_title == $title)' <<<"$prior_runs" >/dev/null; then
            echo 'This source request already has a server workflow run. Post a fresh /merge comment to retry.' >&2
            exit 1
          else
            status=$?
            (( status == 1 )) || exit "$status"
          fi
      - name: Create a source read token
        id: read-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SECUREFIX_SERVER_APP_ID }}
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: ${{ steps.locator.outputs.repository_name }}
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-pull-requests: read
          permission-commit-statuses: read
      - name: Validate the source run
        id: source
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ steps.locator.outputs.repository }}
          SOURCE_RUN_ID: ${{ steps.locator.outputs.run_id }}
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 120))
          while :; do
            run="$(gh api "/repos/$SOURCE_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
            [[ "$(jq -r .status <<<"$run")" == completed ]] && break
            (( SECONDS < deadline )) || { echo 'The source request workflow did not complete successfully within two minutes.' >&2; exit 1; }
            sleep 5
          done
          jq -e --arg repository "$SOURCE_REPOSITORY" '.conclusion == "success" and .run_attempt == 1 and .event == "issue_comment" and .repository.full_name == $repository' <<<"$run" >/dev/null || { echo 'The source run is a rerun or did not originate from the expected repository event.' >&2; exit 1; }
          workflow_id="$(jq -r .workflow_id <<<"$run")"
          source_repo="$(gh api "/repos/$SOURCE_REPOSITORY")"
          workflow="$(gh api "/repos/$SOURCE_REPOSITORY/actions/workflows/$workflow_id")"
          workflow_path=.github/workflows/merge-request.yml
          jq -e --arg path "$workflow_path" --arg branch "$(jq -r .default_branch <<<"$source_repo")" \
            '.path == $path' <<<"$workflow" >/dev/null
          jq -e --arg path "$workflow_path" --arg branch "$(jq -r .default_branch <<<"$source_repo")" \
            '(.path | split("@")[0]) == $path and .head_branch == $branch' <<<"$run" >/dev/null || { echo 'The source run did not use the approved default-branch intake workflow.' >&2; exit 1; }
          source_compare="$(gh api "/repos/$SOURCE_REPOSITORY/compare/$(jq -r .head_sha <<<"$run")...$(jq -r .default_branch <<<"$source_repo")")"
          jq -e '(.status == "ahead" or .status == "identical")' <<<"$source_compare" >/dev/null || { echo 'The source workflow revision is not an ancestor of the current default branch.' >&2; exit 1; }
          wrapper="$(gh api "/repos/$SOURCE_REPOSITORY/contents/$workflow_path?ref=$(jq -r .head_sha <<<"$run")")"
          jq -e '.encoding == "base64"' <<<"$wrapper" >/dev/null || { echo 'The source intake workflow could not be verified.' >&2; exit 1; }
          wrapper_text="$(jq -r .content <<<"$wrapper" | tr -d '\n' | base64 --decode)"
          pins="$(grep -Eo 'uses:[[:space:]]*civitaspo/securefix-server/\.github/workflows/reusable-merge-request\.yml@[0-9a-f]{40}([[:space:]]|$)' <<<"$wrapper_text" | grep -Eo '[0-9a-f]{40}' || true)"
          [[ "$(wc -l <<<"$pins" | tr -d ' ')" == 1 && "$pins" =~ ^[0-9a-f]{40}$ ]] || { echo 'The source workflow must call one approved Securefix merge reusable commit SHA.' >&2; exit 1; }
          pin="$pins"
          jq -e --arg path "civitaspo/securefix-server/.github/workflows/reusable-merge-request.yml@$pin" --arg sha "$pin" \
            '[.referenced_workflows[]? | select(.path | startswith("civitaspo/securefix-server/.github/workflows/reusable-merge-request.yml@"))] as $refs | ($refs|length)==1 and $refs[0].path==$path and $refs[0].sha==$sha' <<<"$run" >/dev/null || { echo 'The source run did not reference the approved reusable commit SHA.' >&2; exit 1; }
          server="$(gh api /repos/civitaspo/securefix-server)"
          server_compare="$(gh api "/repos/civitaspo/securefix-server/compare/$pin...$(jq -r .default_branch <<<"$server")")"
          jq -e '(.status == "ahead" or .status == "identical")' <<<"$server_compare" >/dev/null || { echo 'The reusable workflow revision is not on the Securefix Server default branch.' >&2; exit 1; }
          expected_name="securefix-merge-request-$SOURCE_RUN_ID"
          artifacts="$(gh api --paginate "/repos/$SOURCE_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" | jq -s '{artifacts:[.[].artifacts[]]}')"
          match="$(jq -c --arg name "$expected_name" '[.artifacts[] | select(.name==$name and (.expired|not))]' <<<"$artifacts")"
          jq -e 'length==1 and .[0].size_in_bytes<=16384' <<<"$match" >/dev/null || { echo 'The source run must have exactly one small, unexpired merge request artifact.' >&2; exit 1; }
          {
            echo "artifact_id=$(jq -r '.[0].id' <<<"$match")"
            echo "artifact_name=$expected_name"
            echo "head_sha=$(jq -r .head_sha <<<"$run")"
          } >> "$GITHUB_OUTPUT"
      - name: Download the source request artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          repository: ${{ steps.locator.outputs.repository }}
          run-id: ${{ steps.locator.outputs.run_id }}
          github-token: ${{ steps.read-token.outputs.token }}
          path: ${{ runner.temp }}/merge-request
      - name: Validate the request record and current pull request
        id: manifest
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ steps.locator.outputs.repository }}
          SOURCE_RUN_ID: ${{ steps.locator.outputs.run_id }}
          SOURCE_HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          MANIFEST_PATH: ${{ runner.temp }}/merge-request/manifest.json
        run: |
          set -euo pipefail
          [[ -f "$MANIFEST_PATH" && "$(wc -c < "$MANIFEST_PATH" | tr -d ' ')" -le 16384 ]] || { echo 'The request manifest is missing or too large.' >&2; exit 1; }
          manifest="$(jq -c . "$MANIFEST_PATH")" || { echo 'The request manifest is not valid JSON.' >&2; exit 1; }
          jq -e --arg repository "$SOURCE_REPOSITORY" --arg run "$SOURCE_RUN_ID" --arg sha "$SOURCE_HEAD_SHA" \
            '(.version==1) and (.repository.fullName==$repository) and (.repository.id|type=="number" and .==floor and .>0 and .<=9007199254740991) and
             (.pullRequest.number|type=="number" and .==floor and .>=1 and .<=9007199254740991) and (.pullRequest.headSha|test("^[0-9a-f]{40}$")) and
             (.pullRequest.baseRef|type=="string" and length>0) and (.comment.id|type=="number" and .==floor and .>0 and .<=9007199254740991) and
             (.comment.authorId==4525500) and ((.comment.updatedAt==null) or (.comment.updatedAt|type=="string")) and
             ((.runId|tostring)==$run) and (.runAttempt==1) and (.workflowSha==$sha) and (.workflowSha|test("^[0-9a-f]{40}$")) and
             (.acceptedAt|type=="string" and (sub("\\.[0-9]+Z$";"Z")|fromdateiso8601 as $time | $time <= now and now-$time <= 3600))' <<<"$manifest" >/dev/null || { echo 'The request manifest has invalid fields or an expired deadline.' >&2; exit 1; }
          pr_number="$(jq -r .pullRequest.number <<<"$manifest")"
          accepted_at="$(jq -r .acceptedAt <<<"$manifest")"
          source_repo="$(gh api "/repos/$SOURCE_REPOSITORY")"
          [[ "$(jq -r .id <<<"$source_repo")" == "$(jq -r .repository.id <<<"$manifest")" ]] || { echo 'The request repository ID does not match the source repository.' >&2; exit 1; }
          pr="$(gh api "/repos/$SOURCE_REPOSITORY/pulls/$pr_number")"
          comment="$(gh api "/repos/$SOURCE_REPOSITORY/issues/comments/$(jq -r .comment.id <<<"$manifest")")"
          jq -e --arg repository "$SOURCE_REPOSITORY" --arg base "$(jq -r .default_branch <<<"$source_repo")" --arg accepted_base "$(jq -r .pullRequest.baseRef <<<"$manifest")" --arg head "$(jq -r .pullRequest.headSha <<<"$manifest")" --arg pr "$pr_number" --arg updated "$(jq -r '.comment.updatedAt // ""' <<<"$manifest")" \
            '.state=="open" and .draft==false and .base.repo.full_name==$repository and .base.ref==$base and .base.ref==$accepted_base and .head.sha==$head and .head.repo!=null' <<<"$pr" >/dev/null || { echo 'The pull request no longer matches the accepted request.' >&2; exit 1; }
          updated_at="$(jq -c .comment.updatedAt <<<"$manifest")"
          jq -e --arg url "https://api.github.com/repos/$SOURCE_REPOSITORY/issues/$pr_number" --argjson updated "$updated_at" \
            '.issue_url==$url and .body=="/merge" and .user.id==4525500 and .updated_at==$updated' <<<"$comment" >/dev/null || { echo 'The original comment no longer matches the accepted request.' >&2; exit 1; }
          marker="<!-- securefix-merge-request:$(jq -r .runId <<<"$manifest") -->"
          comments="$(gh api --paginate "/repos/$SOURCE_REPOSITORY/issues/$pr_number/comments?per_page=100" | jq -s 'add')"
          if jq -e --arg marker "$marker" 'any(.[]; .user.id==288069019 and ((.body // "")|contains($marker)))' <<<"$comments" >/dev/null; then
            echo 'This source request has already reached a terminal result.' >&2
            exit 1
          else
            status=$?
            (( status == 1 )) || exit "$status"
          fi
          events="$(gh api --paginate "/repos/$SOURCE_REPOSITORY/issues/$pr_number/timeline?per_page=100" | jq -s 'add')"
          cutoff="$(jq -nr --arg accepted "$accepted_at" '$accepted|sub("\\.[0-9]+Z$";"Z")|fromdateiso8601')"
          if jq -e --argjson cutoff "$cutoff" 'any(.[]; ((.event|IN("head_ref_force_pushed","head_ref_deleted","base_ref_force_pushed","base_ref_deleted","base_ref_changed","merged","closed","reopened","convert_to_draft","ready_for_review")) and ((if has("created_at") then (.created_at|fromdateiso8601) else error("Missing timeline timestamp") end) >= $cutoff)))' <<<"$events" >/dev/null; then
            echo 'The pull request changed after the merge request was accepted.' >&2
            exit 1
          else
            status=$?
            (( status == 1 )) || exit "$status"
          fi
          {
            echo "repository=$SOURCE_REPOSITORY"
            echo "number=$pr_number"
            echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          } >> "$GITHUB_OUTPUT"

  merge:
    needs: resolve
    if: needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    environment: main
    concurrency:
      group: merge-${{ needs.resolve.outputs.repository }}-${{ needs.resolve.outputs.number }}
      cancel-in-progress: false
    permissions:
      contents: read
    timeout-minutes: 70
    outputs:
      merge_sha: ${{ steps.merge.outputs.merge_sha }}
    steps:
      - name: Create a source read token
        id: read-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SECUREFIX_SERVER_APP_ID }}
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: ${{ needs.resolve.outputs.repository_name }}
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-pull-requests: read
          permission-commit-statuses: read
      - name: Wait for required checks and approval
        id: ready
        shell: bash
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          SOURCE_REPOSITORY: ${{ needs.resolve.outputs.repository }}
          MANIFEST: ${{ needs.resolve.outputs.manifest }}
        run: |
          set -euo pipefail
          owner="${SOURCE_REPOSITORY%%/*}"
          repo="${SOURCE_REPOSITORY#*/}"
          pr_number="$(jq -r .pullRequest.number <<<"$MANIFEST")"
          head_sha="$(jq -r .pullRequest.headSha <<<"$MANIFEST")"
          accepted_at="$(jq -r .acceptedAt <<<"$MANIFEST")"
          accepted_epoch="$(jq -nr --arg accepted "$accepted_at" '$accepted|sub("\\.[0-9]+Z$";"Z")|fromdateiso8601')"
          deadline=$(( accepted_epoch + 3600 ))
          check_request() {
            local source_repo pr comment events cutoff updated_at status
            source_repo="$(gh api "/repos/$SOURCE_REPOSITORY")"
            pr="$(gh api "/repos/$SOURCE_REPOSITORY/pulls/$pr_number")"
            comment="$(gh api "/repos/$SOURCE_REPOSITORY/issues/comments/$(jq -r .comment.id <<<"$MANIFEST")")"
            jq -e --arg id "$(jq -r .repository.id <<<"$MANIFEST")" '(.id|tostring)==$id' <<<"$source_repo" >/dev/null || { echo 'The request repository ID changed.' >&2; return 1; }
            jq -e --arg default "$(jq -r .default_branch <<<"$source_repo")" --arg base "$(jq -r .pullRequest.baseRef <<<"$MANIFEST")" --arg head "$head_sha" \
              '.state=="open" and .draft==false and .base.ref==$default and .base.ref==$base and .head.sha==$head and .head.repo!=null' <<<"$pr" >/dev/null || { echo 'The accepted pull request changed while waiting.' >&2; return 1; }
            updated_at="$(jq -c .comment.updatedAt <<<"$MANIFEST")"
            jq -e --argjson updated "$updated_at" '.body=="/merge" and .user.id==4525500 and .updated_at==$updated' <<<"$comment" >/dev/null || { echo 'The accepted comment changed while waiting.' >&2; return 1; }
            events="$(gh api --paginate "/repos/$SOURCE_REPOSITORY/issues/$pr_number/timeline?per_page=100" | jq -s 'add')"
            cutoff="$accepted_epoch"
            if jq -e --argjson cutoff "$cutoff" 'any(.[]; ((.event|IN("head_ref_force_pushed","head_ref_deleted","base_ref_force_pushed","base_ref_deleted","base_ref_changed","merged","closed","reopened","convert_to_draft","ready_for_review")) and ((if has("created_at") then (.created_at|fromdateiso8601) else error("Missing timeline timestamp") end) >= $cutoff)))' <<<"$events" >/dev/null; then
              echo 'The pull request timeline contains an invalidating change.' >&2
              return 1
            else
              status=$?
              (( status == 1 )) || return "$status"
            fi
          }
          readiness() {
            local review checks statuses aggregate legacy
            review="$(gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewDecision}}}' -F owner="$owner" -F name="$repo" -F number="$pr_number")" || return 1
            checks="$(gh api --paginate "/repos/$SOURCE_REPOSITORY/commits/$head_sha/check-runs?per_page=100" | jq -s '[.[].check_runs[]]')" || return 1
            statuses="$(gh api "/repos/$SOURCE_REPOSITORY/commits/$head_sha/status")" || return 1
            aggregate="$(jq -c '[.[] | select(.name=="status-check")][0] // empty' <<<"$checks")" || return 1
            if [[ -n "$aggregate" ]]; then
              jq -e '(.status=="completed") and (.conclusion=="success" or .conclusion=="skipped")' <<<"$aggregate" >/dev/null || return 1
            else
              legacy="$(jq -c '[.statuses[] | select(.context=="status-check")][0] // empty' <<<"$statuses")" || return 1
              [[ -n "$legacy" ]] && jq -e '.state=="success"' <<<"$legacy" >/dev/null || return 1
            fi
            jq -e '.data.repository.pullRequest.reviewDecision=="APPROVED"' <<<"$review" >/dev/null || return 1
          }
          while (( $(jq -nr 'now|floor') < deadline )); do
            check_request
            if readiness; then
              echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
              echo 'Required checks and review are ready for the accepted head SHA.'
              exit 0
            fi
            remaining=$(( deadline - $(jq -nr 'now|floor') ))
            (( remaining > 0 )) || break
            sleep "$(( remaining < 30 ? remaining : 30 ))"
          done
          echo 'Required checks and review did not become ready within the fixed 60-minute deadline.' >&2
          exit 1
      - name: Create a merge token after readiness
        id: merge-token
        if: steps.ready.outcome == 'success'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SECUREFIX_SERVER_APP_ID }}
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: ${{ needs.resolve.outputs.repository_name }}
          permission-checks: read
          permission-commit-statuses: read
          permission-contents: write
          permission-pull-requests: write
      - name: Merge the accepted head SHA
        id: merge
        if: steps.ready.outcome == 'success'
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ needs.resolve.outputs.repository }}
          MANIFEST: ${{ needs.resolve.outputs.manifest }}
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
        run: |
          set -euo pipefail
          owner="${SOURCE_REPOSITORY%%/*}"
          repo="${SOURCE_REPOSITORY#*/}"
          pr_number="$(jq -r .pullRequest.number <<<"$MANIFEST")"
          head_sha="$(jq -r .pullRequest.headSha <<<"$MANIFEST")"
          accepted_at="$(jq -r .acceptedAt <<<"$MANIFEST")"
          accepted_epoch="$(jq -nr --arg accepted "$accepted_at" '$accepted|sub("\\.[0-9]+Z$";"Z")|fromdateiso8601')"
          deadline=$(( accepted_epoch + 3600 ))
          while (( $(jq -nr 'now|floor') < deadline )); do
            source_repo="$(gh api "/repos/$SOURCE_REPOSITORY")"
            pr="$(gh api "/repos/$SOURCE_REPOSITORY/pulls/$pr_number")"
            comment="$(gh api "/repos/$SOURCE_REPOSITORY/issues/comments/$(jq -r .comment.id <<<"$MANIFEST")")"
            jq -e --arg id "$(jq -r .repository.id <<<"$MANIFEST")" '(.id|tostring)==$id' <<<"$source_repo" >/dev/null || { echo 'The request repository ID changed.' >&2; exit 1; }
            jq -e --arg default "$(jq -r .default_branch <<<"$source_repo")" --arg base "$(jq -r .pullRequest.baseRef <<<"$MANIFEST")" --arg head "$head_sha" '.state=="open" and .draft==false and .base.ref==$default and .base.ref==$base and .head.sha==$head and .head.repo!=null' <<<"$pr" >/dev/null || { echo 'The accepted pull request changed before merge.' >&2; exit 1; }
            updated_at="$(jq -c .comment.updatedAt <<<"$MANIFEST")"
            jq -e --argjson updated "$updated_at" '.body=="/merge" and .user.id==4525500 and .updated_at==$updated' <<<"$comment" >/dev/null || { echo 'The accepted comment changed before merge.' >&2; exit 1; }
            events="$(gh api --paginate "/repos/$SOURCE_REPOSITORY/issues/$pr_number/timeline?per_page=100" | jq -s 'add')"
            cutoff="$accepted_epoch"
            if jq -e --argjson cutoff "$cutoff" 'any(.[]; ((.event|IN("head_ref_force_pushed","head_ref_deleted","base_ref_force_pushed","base_ref_deleted","base_ref_changed","merged","closed","reopened","convert_to_draft","ready_for_review")) and ((if has("created_at") then (.created_at|fromdateiso8601) else error("Missing timeline timestamp") end) >= $cutoff)))' <<<"$events" >/dev/null; then
              echo 'The pull request timeline contains an invalidating change.' >&2
              exit 1
            else
              status=$?
              (( status == 1 )) || exit "$status"
            fi
            review="$(gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewDecision}}}' -F owner="$owner" -F name="$repo" -F number="$pr_number")"
            checks="$(gh api --paginate "/repos/$SOURCE_REPOSITORY/commits/$head_sha/check-runs?per_page=100" | jq -s '[.[].check_runs[]]')"
            statuses="$(gh api "/repos/$SOURCE_REPOSITORY/commits/$head_sha/status")"
            aggregate="$(jq -c '[.[] | select(.name=="status-check")][0] // empty' <<<"$checks")"
            checks_ready=false
            if [[ -n "$aggregate" ]]; then
              jq -e '(.status=="completed") and (.conclusion=="success" or .conclusion=="skipped")' <<<"$aggregate" >/dev/null && checks_ready=true
            else
              legacy="$(jq -c '[.statuses[] | select(.context=="status-check")][0] // empty' <<<"$statuses")"
              [[ -n "$legacy" ]] && jq -e '.state=="success"' <<<"$legacy" >/dev/null && checks_ready=true
            fi
            if [[ "$checks_ready" == true ]] && jq -e '.data.repository.pullRequest.reviewDecision=="APPROVED"' <<<"$review" >/dev/null; then
              commits="$(gh api --paginate "/repos/$SOURCE_REPOSITORY/pulls/$pr_number/commits?per_page=100" | jq -s 'add')"
              body="$(jq -r '.body // ""' <<<"$pr")"
              message="$(jq -nr --arg body "$body" --argjson commits "$commits" '
                [($body|split("\n")[]|select(test("^Co-authored-by:[[:space:]]*.*$";"i")))|ascii_downcase] as $existing |
                [$commits[]|.commit.message|split("\n")[]|select(test("^Co-authored-by:[[:space:]]*\\S.+$";"i"))] |
                reduce .[] as $line ([]; if (($existing + (map(ascii_downcase)))|index($line|ascii_downcase)) then . else .+[$line] end) as $trailers |
                if ($trailers|length)==0 then $body elif $body=="" then ($trailers|join("\n")) else ($body+"\n\n"+($trailers|join("\n"))) end')"
              payload="$(jq -n --arg sha "$head_sha" --arg message "$message" '{sha:$sha,merge_method:"squash"} + (if $message=="" then {} else {commit_message:$message} end)')"
              set +e
              response="$(gh api -X PUT "/repos/$SOURCE_REPOSITORY/pulls/$pr_number/merge" --input - <<<"$payload" 2>"$RUNNER_TEMP/merge-error")"
              result=$?
              set -e
              if (( result == 0 )); then
                jq -e '.merged==true and (.sha|test("^[0-9a-f]{40}$"))' <<<"$response" >/dev/null || { echo 'GitHub did not confirm the squash merge result.' >&2; exit 1; }
                echo "merge_sha=$(jq -r .sha <<<"$response")" >> "$GITHUB_OUTPUT"
                echo "Merged $SOURCE_REPOSITORY#$pr_number at $(jq -r .sha <<<"$response")."
                exit 0
              fi
              if grep -Eq 'HTTP 409|HTTP 405|HTTP 422|HTTP 503' "$RUNNER_TEMP/merge-error"; then
                if grep -q 'HTTP 409' "$RUNNER_TEMP/merge-error"; then echo 'The accepted head SHA changed before GitHub merged it.' >&2; exit 1; fi
                echo 'GitHub has not accepted the merge yet; checking again.'
              else
                cat "$RUNNER_TEMP/merge-error" >&2
                exit "$result"
              fi
            fi
            remaining=$(( deadline - $(jq -nr 'now|floor') ))
            (( remaining > 0 )) || break
            sleep "$(( remaining < 30 ? remaining : 30 ))"
          done
          echo 'GitHub did not accept the merge before the fixed 60-minute deadline.' >&2
          exit 1

  notify:
    needs: [resolve, merge]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    environment: main
    permissions: {}
    timeout-minutes: 10
    steps:
      - name: Create a result notification token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SECUREFIX_SERVER_APP_ID }}
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: ${{ needs.resolve.outputs.repository_name }}
          permission-pull-requests: write
      - name: Report the terminal result
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ needs.resolve.outputs.repository }}
          MANIFEST: ${{ needs.resolve.outputs.manifest }}
          MERGE_RESULT: ${{ needs.merge.result }}
          MERGE_SHA: ${{ needs.merge.outputs.merge_sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SERVER_RUN_ID: ${{ github.run_id }}
          SERVER_REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          pr_number="$(jq -r .pullRequest.number <<<"$MANIFEST")"
          run_id="$(jq -r .runId <<<"$MANIFEST")"
          marker="<!-- securefix-merge-request:$run_id -->"
          comments="$(gh api --paginate "/repos/$SOURCE_REPOSITORY/issues/$pr_number/comments?per_page=100" | jq -s 'add')"
          jq -e 'type=="array"' <<<"$comments" >/dev/null
          already_notified="$(jq -r --arg marker "$marker" 'any(.[]; .user.id==288069019 and ((.body // "")|contains($marker)))' <<<"$comments")"
          [[ "$already_notified" == false ]] || exit 0
          succeeded=false
          [[ "$MERGE_RESULT" == success && "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]] && succeeded=true
          if [[ "$succeeded" == true ]]; then
            message="Securefix merged this pull request with squash at $MERGE_SHA."
          else
            message='Securefix could not merge this request. The request expired or a validation check failed. Post a new exact `/merge` comment after resolving the issue.'
          fi
          body="$marker
          $message

          Server run: ${SERVER_URL:-https://github.com}/$SERVER_REPOSITORY/actions/runs/$SERVER_RUN_ID"
          payload="$(jq -n --arg body "$body" '{body:$body}')"
          gh api -X POST "/repos/$SOURCE_REPOSITORY/issues/$pr_number/comments" --input - <<<"$payload" >/dev/null

  cleanup:
    needs: [resolve, merge, notify]
    if: always() && startsWith(github.event.label.name, 'merge-request-')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 10
    steps:
      - name: Delete the one-time request label
        shell: bash
        env:
          LABEL_NAME: ${{ github.event.label.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          encoded_label="$(jq -nr --arg label "$LABEL_NAME" '$label|@uri')"
          if gh api -X DELETE "/repos/$GITHUB_REPOSITORY/labels/$encoded_label" 2>"$RUNNER_TEMP/label-error"; then
            exit 0
          fi
          if grep -q 'HTTP 404' "$RUNNER_TEMP/label-error"; then
            exit 0
          fi
          cat "$RUNNER_TEMP/label-error" >&2
          exit 1
