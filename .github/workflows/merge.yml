name: Merge Pull Request
run-name: Merge Pull Request (${{ github.event.label.description }})

on:
  label:
    types:
      - created

permissions: {}

concurrency:
  group: merge-${{ github.event.label.description }}
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.event.label.name, 'merge-request-')
    uses: ./.github/workflows/load-cli.yml
    permissions:
      contents: read
      attestations: read

  merge:
    needs: build
    if: needs.build.result == 'success' && startsWith(github.event.label.name, 'merge-request-')
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    timeout-minutes: 70
    env:
      SECUREFIX_SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: runtime
          merge-multiple: true
      - name: Restore trusted CLI executable mode
        run: chmod 755 runtime/securefix
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: read-token
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-statuses: read
      - name: Validate source proof and accepted head
        id: validate
        env:
          SECUREFIX_SERVER_TOKEN: ${{ steps.read-token.outputs.token }}
        run: runtime/securefix merge validate
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.validate.outcome == 'success'
        id: authorization-token
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: ${{ steps.validate.outputs.repository_name }}
          permission-checks: write
          permission-issues: write
          permission-pull-requests: write
      - name: Record owner authorization for the exact head
        id: authorize
        if: steps.validate.outcome == 'success'
        env:
          SECUREFIX_SERVER_TOKEN: ${{ steps.read-token.outputs.token }}
          SECUREFIX_AUTHORIZATION_TOKEN: ${{ steps.authorization-token.outputs.token }}
        run: runtime/securefix merge authorize
      - name: Wait for current checks and review approval
        id: wait
        if: steps.authorize.outcome == 'success'
        env:
          SECUREFIX_SERVER_TOKEN: ${{ steps.read-token.outputs.token }}
        run: runtime/securefix merge wait
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.wait.outcome == 'success'
        id: merge-token
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: ${{ steps.validate.outputs.repository_name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Merge the accepted SHA
        id: apply
        if: steps.wait.outcome == 'success'
        env:
          SECUREFIX_SERVER_TOKEN: ${{ steps.read-token.outputs.token }}
          SECUREFIX_MERGE_TOKEN: ${{ steps.merge-token.outputs.token }}
        run: runtime/securefix merge apply
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: always() && steps.validate.outcome == 'success'
        id: notify-token
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: ${{ steps.validate.outputs.repository_name }}
          permission-issues: write
          permission-pull-requests: write
      - name: Report the terminal result
        if: always() && steps.validate.outcome == 'success' && steps.notify-token.outcome == 'success'
        env:
          SECUREFIX_NOTIFY_TOKEN: ${{ steps.notify-token.outputs.token }}
          SECUREFIX_MERGE_RESULT: ${{ steps.apply.outcome }}
          SECUREFIX_MERGE_SHA: ${{ steps.apply.outputs.merge_sha }}
        run: runtime/securefix merge notify

  cleanup:
    needs: [build, merge]
    if: always() && needs.build.result == 'success' && startsWith(github.event.label.name, 'merge-request-')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 5
    env:
      SECUREFIX_SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: runtime
          merge-multiple: true
      - name: Restore trusted CLI executable mode
        run: chmod 755 runtime/securefix
      - name: Delete the one-time request label
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: runtime/securefix merge cleanup
