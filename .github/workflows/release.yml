name: Release Terraform Provider
run-name: Release Terraform Provider (${{ github.event.label.name }})

on:
  label:
    types:
      - created

permissions: {}

concurrency:
  group: release-tf-provider-${{ github.event.label.name }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.event.label.name, 'release-tf-provider-')
    runs-on: ubuntu-latest
    environment: main
    permissions:
      issues: write
    timeout-minutes: 30

    steps:
      - name: Parse release request
        id: request
        env:
          DESCRIPTION: ${{ github.event.label.description }}
        run: |
          set -euo pipefail
          # Description formats:
          #   owner/repo/run_id
          #   owner/repo/run_id/tag (preferred; tag like v0.1.0)
          repository=$(printf '%s' "$DESCRIPTION" | cut -d/ -f1-2)
          run_id=$(printf '%s' "$DESCRIPTION" | cut -d/ -f3)
          tag=$(printf '%s' "$DESCRIPTION" | cut -d/ -f4-)

          if [ "$repository" != "civitaspo/terraform-provider-sigma" ]; then
            echo "Denied client repository: $repository" >&2
            exit 1
          fi
          case "$run_id" in
            ''|*[!0-9]*)
              echo "Invalid workflow run ID" >&2
              exit 1
              ;;
          esac
          if [ -n "$tag" ] && ! printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Invalid tag in label description: $tag" >&2
            exit 1
          fi

          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create provider installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.SECUREFIX_SERVER_APP_ID }}
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: terraform-provider-sigma
          permission-actions: read
          permission-contents: write

      - name: Validate Release Tag workflow run
        id: validate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ steps.request.outputs.repository }}
          RUN_ID: ${{ steps.request.outputs.run_id }}
          REQUESTED_TAG: ${{ steps.request.outputs.tag }}
        run: |
          set -euo pipefail
          workflow_run=$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID")

          printf '%s' "$workflow_run" | jq -e '
            .name == "Release Tag"
            and .repository.full_name == "civitaspo/terraform-provider-sigma"
            and .head_repository.full_name == "civitaspo/terraform-provider-sigma"
            and (
              .status == "in_progress"
              or .status == "queued"
              or (.status == "completed" and .conclusion == "success")
            )
          ' >/dev/null

          head_sha=$(printf '%s' "$workflow_run" | jq -er '.head_sha | select(test("^[0-9a-f]{40}$"))')
          tag=$REQUESTED_TAG
          if [ -z "$tag" ]; then
            head_branch=$(printf '%s' "$workflow_run" | jq -r '.head_branch // empty')
            if printf '%s' "$head_branch" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
              tag=$head_branch
            fi
          fi
          if [ -z "$tag" ]; then
            echo "Release tag missing from label description and workflow head_branch" >&2
            exit 1
          fi

          echo "Allowed Release Tag run $RUN_ID for $REPOSITORY at $tag"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out provider tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.request.outputs.repository }}
          ref: ${{ steps.validate.outputs.tag }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is contained in main
        env:
          EXPECTED_SHA: ${{ steps.validate.outputs.head_sha }}
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          tag_commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          test "$(git rev-parse HEAD)" = "$tag_commit"
          test "$EXPECTED_SHA" = "$tag_commit"
          git merge-base --is-ancestor "$tag_commit" origin/main

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.26.x

      - name: Import release signing key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.TERRAFORM_PROVIDER_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.TERRAFORM_PROVIDER_GPG_PASSPHRASE }}

      - name: Release provider
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}

      - name: Delete release request label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          set -euo pipefail
          encoded_label=$(jq -rn --arg label "$LABEL_NAME" '$label | @uri')
          gh api --method DELETE "repos/${{ github.repository }}/labels/$encoded_label"
