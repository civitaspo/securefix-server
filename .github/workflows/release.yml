name: Release
run-name: Release (${{ github.event.label.name }})

on:
  label:
    types: [created]

permissions: {}
concurrency:
  group: release-${{ github.event.label.name }}
  cancel-in-progress: false

jobs:
  cli:
    if: startsWith(github.event.label.name, 'release-request-')
    uses: ./.github/workflows/load-cli.yml
    permissions:
      contents: read
      attestations: read

  resolve-request:
    needs: cli
    if: startsWith(github.event.label.name, 'release-request-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      repository: ${{ steps.parse.outputs.repository }}
      repo_name: ${{ steps.parse.outputs.repo_name }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.cli.outputs.artifact-id }}
          path: ${{ runner.temp }}/securefix-runtime
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        with:
          binary: ${{ runner.temp }}/securefix-runtime/securefix
      - name: Parse untrusted request locator
        id: parse
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_SOURCE_SHA: ${{ job.workflow_sha }}
        run: securefix release parse-request

  preflight:
    needs: [cli, resolve-request]
    if: startsWith(github.event.label.name, 'release-request-')
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: read
      actions: read
    outputs:
      strategy: ${{ steps.preflight.outputs.strategy }}
      tag: ${{ steps.preflight.outputs.tag }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.cli.outputs.artifact-id }}
          path: ${{ runner.temp }}/securefix-runtime
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        with:
          binary: ${{ runner.temp }}/securefix-runtime/securefix
      - name: Create repo-scoped token that can inspect draft releases
        id: client-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: ${{ needs.resolve-request.outputs.repo_name }}
          permission-actions: read
          permission-contents: write
          permission-pull-requests: read
      - name: Validate current release provenance
        id: preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.client-token.outputs.token }}
          SECUREFIX_SOURCE_SHA: ${{ job.workflow_sha }}
        run: securefix release preflight
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: release-input
          path: release-input/
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: [cli, resolve-request, preflight]
    if: needs.preflight.outputs.strategy == 'terraform-provider'
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: read
      actions: read
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.cli.outputs.artifact-id }}
          path: ${{ runner.temp }}/securefix-runtime
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        with:
          binary: ${{ runner.temp }}/securefix-runtime/securefix
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.preflight.outputs.artifact_id }}
          path: release-input
          merge-multiple: true
      - name: Import provider release signing key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.TERRAFORM_PROVIDER_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.TERRAFORM_PROVIDER_GPG_PASSPHRASE }}
      - name: Sign canonical provider checksums
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_SOURCE_SHA: ${{ job.workflow_sha }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.TERRAFORM_PROVIDER_GPG_PASSPHRASE }}
        run: securefix release sign
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: release-package
          path: release-input/
          if-no-files-found: error
          retention-days: 1
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}

  publish:
    needs: [cli, resolve-request, preflight, sign]
    if: always() && needs.preflight.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: read
      actions: read
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.cli.outputs.artifact-id }}
          path: ${{ runner.temp }}/securefix-runtime
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        with:
          binary: ${{ runner.temp }}/securefix-runtime/securefix
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.preflight.outputs.strategy == 'terraform-provider' && needs.sign.outputs.artifact_id || needs.preflight.outputs.artifact_id }}
          path: release-package
          merge-multiple: true
      - name: Create content-scoped client token
        id: client-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: ${{ needs.resolve-request.outputs.repo_name }}
          permission-actions: read
          permission-contents: write
          permission-pull-requests: read
      - name: Publish verified release plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.client-token.outputs.token }}
          SECUREFIX_SOURCE_SHA: ${{ job.workflow_sha }}
        run: securefix release publish

  cleanup:
    if: always() && startsWith(github.event.label.name, 'release-request-')
    needs: [cli, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        if: needs.cli.result == 'success'
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.cli.outputs.artifact-id }}
          path: ${{ runner.temp }}/securefix-runtime
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        with:
          binary: ${{ runner.temp }}/securefix-runtime/securefix
      - if: needs.cli.result == 'success'
        run: securefix release cleanup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_SOURCE_SHA: ${{ job.workflow_sha }}
