name: Repository settings
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      repository:
        description: Repository name under civitaspo; leave empty for the configured set
        required: false
        default: ""
      create_if_missing:
        description: Create the selected repository if it does not exist
        type: boolean
        default: false
      merge_controls_ready:
        description: Attest that the full configured set passed activation readiness checks
        type: boolean
        default: false
permissions: {}
concurrency:
  group: repo-settings
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/build-cli.yml
    permissions:
      contents: read
  prepare:
    needs: build
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: read
    outputs:
      repositories: ${{ steps.cli.outputs.repositories }}
      repos_list: ${{ steps.cli.outputs.repos_list }}
      activate: ${{ steps.cli.outputs.activate_merge_controls }}
      bot_invite: ${{ steps.cli.outputs.bot_invite }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: runtime
          merge-multiple: true
      - name: Prepare desired reconciliation
        id: cli
        env:
          GH_TOKEN: ${{ secrets.CIVITASPO_PUBLIC_REPO_SETTINGS_TOKEN }}
          BOT_TOKEN: ${{ secrets.CIVITASPO_BOT_REPO_INVITE_TOKEN }}
          CIVITASPO_BOT_PR_APPROVE_TOKEN: ${{ secrets.CIVITASPO_BOT_PR_APPROVE_TOKEN }}
          INPUT_REPOSITORY: ${{ inputs.repository }}
          INPUT_MERGE_CONTROLS_READY: ${{ inputs.merge_controls_ready }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SECUREFIX_SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
        working-directory: runtime
        run: chmod +x ./securefix && ./securefix settings prepare
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.cli.outputs.activate_merge_controls == 'true'
        id: app-token
        with:
          app-id: 3872533
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: ${{ steps.cli.outputs.repos_list }}
          permission-actions: read
          permission-checks: write
          permission-contents: write
          permission-pull-requests: write
      - name: Attested activation preflight
        if: steps.cli.outputs.activate_merge_controls == 'true'
        env:
          GH_TOKEN: ${{ secrets.CIVITASPO_PUBLIC_REPO_SETTINGS_TOKEN }}
          SECUREFIX_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          CIVITASPO_BOT_PR_APPROVE_TOKEN: ${{ secrets.CIVITASPO_BOT_PR_APPROVE_TOKEN }}
          INPUT_MERGE_CONTROLS_READY: ${{ inputs.merge_controls_ready }}
          INPUT_REPOSITORY: ${{ inputs.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SECUREFIX_SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
        working-directory: runtime
        run: ./securefix settings activation-preflight
  reconcile:
    needs: [build, prepare]
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJson(needs.prepare.outputs.repositories) }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: runtime
          merge-multiple: true
      - name: Reconcile repository settings
        env:
          GH_TOKEN: ${{ secrets.CIVITASPO_PUBLIC_REPO_SETTINGS_TOKEN }}
          BOT_TOKEN: ${{ secrets.CIVITASPO_BOT_REPO_INVITE_TOKEN }}
          REPOSITORY: ${{ matrix.repository }}
          INPUT_CREATE_IF_MISSING: ${{ inputs.create_if_missing }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SECUREFIX_SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
        working-directory: runtime
        run: chmod +x ./securefix && ./securefix settings reconcile --repository "$REPOSITORY"
  controlled-merges:
    needs: [build, prepare, reconcile]
    if: needs.prepare.outputs.activate == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: runtime
          merge-multiple: true
      - name: Mint scoped token for controlled merge checks
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: 3872533
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: ${{ needs.prepare.outputs.repos_list }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: write
          permission-actions: read
      - name: Reconcile controlled merge rulesets
        env:
          GH_TOKEN: ${{ secrets.CIVITASPO_PUBLIC_REPO_SETTINGS_TOKEN }}
          SECUREFIX_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_MERGE_CONTROLS_READY: ${{ inputs.merge_controls_ready }}
          INPUT_REPOSITORY: ${{ inputs.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SECUREFIX_SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
        working-directory: runtime
        run: chmod +x ./securefix && ./securefix settings controlled-merges
