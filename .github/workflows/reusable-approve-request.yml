name: Reusable Approve Request

on:
  workflow_call:
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY:
        required: true

# Shared Securefix client app + server repository (not per-client vars).
# Keep allowed_committers in sync with approve.yml and approve-request.yml.
env:
  SECUREFIX_CLIENT_APP_ID: "3872492"
  SECUREFIX_SERVER_REPOSITORY: securefix-server

permissions: {}

jobs:
  approve:
    name: approve
    if: |
      (
        github.event_name == 'pull_request_target' &&
        contains(fromJSON('["civitaspo", "renovate[bot]", "dependabot[bot]", "civitaspo-securefix-server[bot]"]'), github.actor)
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.body == '/approve' &&
        github.event.comment.user.login == 'civitaspo'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10

    steps:
      - name: Request pull request approval
        uses: csm-actions/approve-pr-action@452271472f121d6d2f8e7a0761488d2fcc29b715 # v0.2.0
        with:
          app_id: ${{ env.SECUREFIX_CLIENT_APP_ID }}
          app_private_key: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
          server_repository_name: ${{ env.SECUREFIX_SERVER_REPOSITORY }}
          pull_request_number: ${{ github.event.pull_request.number || github.event.issue.number }}
          # Client validates before creating the server label. Defaults are only
          # renovate/dependabot, so trusted human/bot committers must be listed
          # here as well (must stay in sync with approve.yml).
          allowed_committers: |
            civitaspo
            cursoragent
            civitaspo-securefix-server[bot]
            renovate[bot]
            dependabot[bot]
