name: Reusable Merge Request

on:
  workflow_call:
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  build:
    uses: ./.github/workflows/load-cli.yml
    permissions:
      contents: read
      attestations: read

  capture:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.repository == 'civitaspo/securefix-server' && 'main' || null }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SECUREFIX_SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: runtime
          merge-multiple: true
      - name: Restore trusted CLI executable mode
        run: chmod 755 runtime/securefix
      - name: Capture and validate the merge request
        run: runtime/securefix request capture-merge
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: securefix-request-${{ github.run_id }}
          path: request/manifest.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: client-token
        with:
          app-id: ${{ vars.SECUREFIX_CLIENT_APP_ID || '3872492' }}
          private-key: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
          owner: civitaspo
          repositories: securefix-server
          permission-issues: write
      - name: Dispatch the request to Securefix Server
        env:
          SECUREFIX_APP_TOKEN: ${{ steps.client-token.outputs.token }}
        run: runtime/securefix request dispatch
