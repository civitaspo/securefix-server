name: Reusable Merge Request

on:
  workflow_call:
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY:
        required: false

env:
  SECUREFIX_CLIENT_APP_ID: ${{ vars.SECUREFIX_CLIENT_APP_ID }}
  SECUREFIX_SERVER_REPOSITORY: ${{ vars.SECUREFIX_SERVER_REPOSITORY }}

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  request:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/merge' &&
      github.event.comment.user.id == 4525500 &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: ${{ github.repository == 'civitaspo/securefix-server' && 'main' || null }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - name: Require the configured Client App credentials
        env:
          APP_ID: ${{ env.SECUREFIX_CLIENT_APP_ID }}
          SERVER_REPOSITORY: ${{ env.SECUREFIX_SERVER_REPOSITORY }}
          APP_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test "${APP_ID}" = "3872492"
          test "${SERVER_REPOSITORY}" = "securefix-server"
          test -n "${APP_PRIVATE_KEY}"
      - name: Capture the merge request
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -e '.repository.owner.login == "civitaspo" and .comment.user.id == 4525500 and .comment.body == "/merge"' "$GITHUB_EVENT_PATH" >/dev/null
          number=$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")
          comment_id=$(jq -r '.comment.id' "$GITHUB_EVENT_PATH")
          accepted_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}")
          repository=$(gh api "repos/${GITHUB_REPOSITORY}")
          comment=$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}")
          jq -en --argjson pr "$pr" --argjson repository "$repository" --argjson comment "$comment" '
            $pr.state == "open" and $pr.draft == false and
            $pr.base.ref == $repository.default_branch and
            $comment.body == "/merge" and $comment.user.id == 4525500
          ' >/dev/null
          mkdir -p merge-request
          umask 077
          jq -n --argjson pr "$pr" --argjson repository "$repository" --argjson comment "$comment" \
            --arg accepted_at "$accepted_at" --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" --arg workflow_sha "$GITHUB_SHA" '
            {
              version: 1,
              repository: {id: $repository.id, fullName: $repository.full_name},
              pullRequest: {number: $pr.number, headSha: $pr.head.sha, baseRef: $pr.base.ref},
              comment: {id: $comment.id, authorId: $comment.user.id, updatedAt: $comment.updated_at},
              acceptedAt: $accepted_at,
              runId: $run_id,
              runAttempt: $run_attempt,
              workflowSha: $workflow_sha
            }
          ' > merge-request/manifest.json
          echo "repository=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
          echo "run_id=${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
      - name: Upload the immutable request record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: securefix-merge-request-${{ github.run_id }}
          path: merge-request/manifest.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false
      - name: Create the Securefix request label
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.SECUREFIX_CLIENT_APP_ID }}
          private-key: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
          owner: civitaspo
          repositories: ${{ vars.SECUREFIX_SERVER_REPOSITORY }}
          permission-issues: write
      - name: Notify Securefix Server
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SERVER_REPOSITORY: ${{ vars.SECUREFIX_SERVER_REPOSITORY }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ steps.manifest.outputs.run_id }}
        run: |
          name="merge-request-${SOURCE_RUN_ID}"
          description="${SOURCE_REPOSITORY}/${SOURCE_RUN_ID}"
          test "${SOURCE_REPOSITORY%%/*}" = civitaspo
          test "${#name}" -le 50
          test "${#description}" -le 100
          gh api --method POST "repos/civitaspo/${SERVER_REPOSITORY}/labels" \
            -f name="$name" -f color=1f6feb -f description="$description"
          printf '## Merge request sent to Securefix Server\n\nRequest %s for %s is queued for validation.\n' \
            "$SOURCE_RUN_ID" "$SOURCE_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
