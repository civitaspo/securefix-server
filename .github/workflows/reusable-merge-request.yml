name: Reusable Merge Request

on:
  workflow_call:
    inputs:
      server_repository:
        description: Authenticated Server instance repository locator
        required: true
        type: string
      instance_config_path:
        description: Root-relative protected Server instance TOML path
        required: true
        type: string
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  request:
    uses: ./.github/workflows/reusable-client-request.yml
    with:
      operation: merge
      server_repository: ${{ inputs.server_repository }}
      instance_config_path: ${{ inputs.instance_config_path }}
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
