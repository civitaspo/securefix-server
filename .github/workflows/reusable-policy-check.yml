name: Policy Request
on:
  workflow_call:
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY:
        required: true
permissions: {}
jobs:
  cli:
    uses: ./.github/workflows/load-cli.yml
    permissions:
      contents: read
      attestations: read

  request:
    needs: cli
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    timeout-minutes: 10
    env:
      SECUREFIX_SOURCE_SHA: ${{ needs.cli.outputs.source-sha }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.cli.outputs.artifact-id }}
          path: ${{ runner.temp }}/securefix-runtime
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        with:
          binary: ${{ runner.temp }}/securefix-runtime/securefix
      - run: securefix check capture
        id: capture
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.capture.outputs.artifact_name }}
          path: policy-request/manifest.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: '3872492'
          private-key: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
          owner: civitaspo
          repositories: securefix-server
          permission-issues: write
      - run: securefix check dispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_APP_TOKEN: ${{ steps.app.outputs.token }}
