name: Reusable Release PR Sync

on:
  workflow_call:
permissions: {}
jobs:
  cli:
    uses: ./.github/workflows/build-cli.yml
    permissions:
      contents: read

  sync:
    needs: cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/next
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.cli.outputs.artifact-id }}
          path: runtime
          merge-multiple: true
      - run: chmod 755 runtime/securefix
      - name: Sync release PR title and summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_SOURCE_SHA: ${{ job.workflow_sha }}
        run: runtime/securefix release sync-pr
