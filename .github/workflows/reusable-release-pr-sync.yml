name: Reusable Release PR Sync

on:
  workflow_call:
permissions: {}
jobs:
  cli:
    uses: ./.github/workflows/load-cli.yml
    permissions:
      contents: read
      attestations: read

  sync:
    needs: cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/next
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.cli.outputs.artifact-id }}
          path: runtime
          merge-multiple: true
      - run: chmod 755 runtime/securefix
      - name: Sync release PR title and summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_SOURCE_SHA: ${{ job.workflow_sha }}
        run: runtime/securefix release sync-pr
