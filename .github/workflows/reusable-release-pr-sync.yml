name: Reusable Release PR Sync

on:
  workflow_call:
permissions: {}
jobs:
  cli:
    uses: ./.github/workflows/load-cli.yml
    permissions:
      contents: read
      attestations: read

  sync:
    needs: cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.cli.outputs.artifact-id }}
          path: ${{ runner.temp }}/securefix-runtime
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        with:
          binary: ${{ runner.temp }}/securefix-runtime/securefix
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/next
          persist-credentials: false
      - name: Sync release PR title and summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_SOURCE_SHA: ${{ job.workflow_sha }}
        run: securefix release sync-pr
