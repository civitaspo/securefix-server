name: Reusable Release PR

on:
  workflow_call:
    inputs:
      version:
        description: Explicit release version, or empty to compute it with git-cliff
        required: false
        type: string
        default: ""
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  cli:
    uses: ./.github/workflows/load-cli.yml
    permissions:
      contents: read
      attestations: read

  prepare:
    needs: cli
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.cli.outputs.artifact-id }}
          path: ${{ runner.temp }}/securefix-runtime
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.3"
          install_args: "--locked"
          cache: false
      - uses: $/.github/actions/install-cli
        with:
          binary: ${{ runner.temp }}/securefix-runtime/securefix
      - name: Prepare release metadata
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_SOURCE_SHA: ${{ job.workflow_sha }}
          INPUT_VERSION: ${{ inputs.version }}
        run: securefix release prepare --version "$INPUT_VERSION"
      - name: Prepare native Securefix client artifact
        id: request
        if: steps.release.outputs.releasable == 'true'
        env:
          SECUREFIX_SOURCE_SHA: ${{ needs.cli.outputs.source-sha }}
          FILES: ${{ steps.release.outputs.files }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          PULL_REQUEST_TITLE: "chore(release): v${{ steps.release.outputs.version }}"
          PULL_REQUEST_BODY: |
            ## Summary
            - Prepare release v${{ steps.release.outputs.version }}
            - Update the changelog and ${{ steps.release.outputs.body_extra }}

            This pull request is managed by the Release PR workflow.
        run: |
          securefix securefix client-prepare \
            --root-dir "" \
            --files "$FILES" \
            --repository "$GITHUB_REPOSITORY" \
            --branch release/next \
            --commit-message "chore(release): prepare v$RELEASE_VERSION" \
            --pull-request-title "$PULL_REQUEST_TITLE" \
            --pull-request-body "$PULL_REQUEST_BODY" \
            --pull-request-base main \
            --custom-json '{}' \
            --output-dir .securefix-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.request.outcome == 'success' && steps.request.outputs.artifact_name != ''
        with:
          name: ${{ steps.request.outputs.artifact_name }}
          path: ${{ steps.request.outputs.artifact_path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.request.outcome == 'success' && steps.request.outputs.artifact_name != ''
        id: client-token
        with:
          app-id: '3872492'
          private-key: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
          owner: civitaspo
          repositories: securefix-server
          permission-issues: write
      - name: Dispatch native Securefix client request
        if: steps.request.outcome == 'success' && steps.request.outputs.artifact_name != ''
        env:
          SECUREFIX_SOURCE_SHA: ${{ needs.cli.outputs.source-sha }}
          SECUREFIX_CLIENT_TOKEN: ${{ steps.client-token.outputs.token }}
          ARTIFACT_NAME: ${{ steps.request.outputs.artifact_name }}
        run: securefix securefix client-dispatch --artifact-name "$ARTIFACT_NAME" --server-repository civitaspo/securefix-server
