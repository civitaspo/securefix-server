name: Reusable Release PR

on:
  workflow_call:
    inputs:
      version:
        description: Explicit release version, or empty to compute it with git-cliff
        required: false
        type: string
        default: ""
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  cli:
    uses: ./.github/workflows/build-cli.yml
    permissions:
      contents: read

  prepare:
    needs: cli
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.3"
          install_args: "--locked"
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.cli.outputs.artifact-id }}
          path: runtime
          merge-multiple: true
      - run: chmod 755 runtime/securefix
      - name: Prepare release metadata
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_SOURCE_SHA: ${{ job.workflow_sha }}
          INPUT_VERSION: ${{ inputs.version }}
        run: runtime/securefix release prepare --version "$INPUT_VERSION"
      - name: Request signed release PR update
        if: steps.release.outputs.releasable == 'true'
        uses: csm-actions/securefix-action@4d885e1bcb71f4f110215c833002ce9fa0ee0fa6 # v0.6.0
        with:
          action: client
          app_id: "3872492"
          app_private_key: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
          server_repository: securefix-server
          files: ${{ steps.release.outputs.files }}
          use_git_ls_files: "false"
          branch: release/next
          commit_message: "chore(release): prepare v${{ steps.release.outputs.version }}"
          pull_request_title: "chore(release): v${{ steps.release.outputs.version }}"
          pull_request_base_branch: main
          pull_request_body: |
            ## Summary
            - Prepare release v${{ steps.release.outputs.version }}
            - Update the changelog and ${{ steps.release.outputs.body_extra }}

            This pull request is managed by the Release PR workflow.
