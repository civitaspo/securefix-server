name: Reusable Release Tag

on:
  workflow_call:
    inputs:
      release_pr_number:
        description: Merged release/next PR to retry
        required: false
        type: number
        default: 0
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  cli:
    uses: ./.github/workflows/load-cli.yml
    permissions:
      contents: read
      attestations: read

  resolve:
    needs: cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      merge_sha: ${{ steps.resolve.outputs.merge_sha }}
      strategy: ${{ steps.resolve.outputs.strategy }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.cli.outputs.artifact-id }}
          path: runtime
          merge-multiple: true
      - run: chmod 755 runtime/securefix
      - name: Validate merged release PR
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_SOURCE_SHA: ${{ job.workflow_sha }}
          RELEASE_PR_NUMBER: ${{ inputs.release_pr_number || github.event.pull_request.number }}
        run: |
          runtime/securefix release resolve-pr --release-pr-number "$RELEASE_PR_NUMBER"
          echo "pr_number=$RELEASE_PR_NUMBER" >> "$GITHUB_OUTPUT"

  build:
    needs: [cli, resolve]
    if: needs.resolve.outputs.strategy == 'terraform-provider'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.merge_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.cli.outputs.artifact-id }}
          path: runtime
          merge-multiple: true
      - run: chmod 755 runtime/securefix
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: false
      - name: Build fixed provider target matrix
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_SOURCE_SHA: ${{ job.workflow_sha }}
          RELEASE_PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        run: runtime/securefix release build-provider --release-pr-number "$RELEASE_PR_NUMBER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: provider-bundle
          path: dist/release-assets/*
          if-no-files-found: error
          retention-days: 1

  tag:
    needs: [cli, resolve, build]
    if: always() && needs.resolve.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.cli.outputs.artifact-id }}
          path: runtime
          merge-multiple: true
      - run: chmod 755 runtime/securefix
      - name: Create and verify release tag manifest
        id: manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_SOURCE_SHA: ${{ job.workflow_sha }}
          RELEASE_PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          PROVIDER_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id || '0' }}
        run: runtime/securefix release tag-pr --release-pr-number "$RELEASE_PR_NUMBER" --artifact-id "$PROVIDER_ARTIFACT_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest
          path: manifest.json
          if-no-files-found: error
          retention-days: 1
      - name: Create server-only request token
        id: server-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: "3872492"
          private-key: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
          owner: civitaspo
          repositories: securefix-server
          permission-issues: write
      - name: Request server release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.server-token.outputs.token }}
          SECUREFIX_SOURCE_SHA: ${{ job.workflow_sha }}
        run: runtime/securefix release request-server
