name: Securefix
on:
  label:
    types: [created]
permissions: {}
concurrency:
  group: securefix-${{ github.event.label.name }}
  cancel-in-progress: false
jobs:
  runtime:
    if: startsWith(github.event.label.name, 'securefix-')
    uses: ./.github/workflows/load-cli.yml
    permissions:
      contents: read
      attestations: read
  fix:
    needs: runtime
    if: startsWith(github.event.label.name, 'securefix-')
    runs-on: ubuntu-latest
    environment: main
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    env:
      SECUREFIX_SOURCE_SHA: ${{ needs.runtime.outputs.source-sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.runtime.outputs.artifact-id }}
          path: ${{ runner.temp }}/securefix-runtime
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        with:
          binary: ${{ runner.temp }}/securefix-runtime/securefix
      - name: Validate label event and source capability
        id: event
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: securefix securefix validate-event
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: read-token
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          permission-actions: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
      - name: Validate artifact and bind the destination head
        id: prepare
        env:
          SECUREFIX_SERVER_TOKEN: ${{ steps.read-token.outputs.token }}
        run: securefix securefix prepare
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: write-token
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: ${{ steps.prepare.outputs.repository_name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Apply the authorized signed commit
        id: apply
        env:
          SECUREFIX_SERVER_TOKEN: ${{ steps.read-token.outputs.token }}
          SECUREFIX_WRITE_TOKEN: ${{ steps.write-token.outputs.token }}
        run: securefix securefix apply
      - name: Delete the consumed request label
        if: always() && steps.event.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: securefix securefix cleanup
