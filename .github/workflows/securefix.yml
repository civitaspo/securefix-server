name: Securefix

on:
  label:
    types:
      - created

permissions: {}

concurrency:
  group: securefix-${{ github.event.label.name }}
  cancel-in-progress: false

jobs:
  fix:
    if: startsWith(github.event.label.name, 'securefix-')
    runs-on: ubuntu-latest
    environment: main
    permissions:
      issues: write
    timeout-minutes: 10

    steps:
      - name: Checkout Securefix configuration
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          sparse-checkout: securefix-config.yaml
          sparse-checkout-cone-mode: false

      - name: Prepare Securefix request
        id: prepare
        uses: csm-actions/securefix-action@4d885e1bcb71f4f110215c833002ce9fa0ee0fa6 # v0.6.0
        with:
          action: prepare
          allow_workflow_fix: true
          app_id: ${{ vars.SECUREFIX_SERVER_APP_ID }}
          app_private_key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          config_file: securefix-config.yaml
          workflow_name: ""

      - name: Allowlist client workflows
        env:
          WORKFLOW_RUN: ${{ steps.prepare.outputs.workflow_run }}
        run: |
          set -euo pipefail
          name=$(printf '%s' "$WORKFLOW_RUN" | jq -r '.name')
          case "$name" in
            Lint|Release\ PR)
              echo "Allowed client workflow: $name"
              ;;
            *)
              echo "Denied client workflow: $name" >&2
              exit 1
              ;;
          esac

      - name: Create Securefix commit
        uses: csm-actions/securefix-action@4d885e1bcb71f4f110215c833002ce9fa0ee0fa6 # v0.6.0
        with:
          action: commit
          outputs: ${{ toJson(steps.prepare.outputs) }}

      - name: Notify Securefix failure
        if: failure()
        uses: csm-actions/securefix-action@4d885e1bcb71f4f110215c833002ce9fa0ee0fa6 # v0.6.0
        with:
          action: notify
          outputs: ${{ toJson(steps.prepare.outputs) }}
