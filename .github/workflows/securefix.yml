name: Securefix
on:
  label:
    types: [created]
permissions: {}
concurrency:
  group: securefix-${{ github.event.label.name }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/load-cli.yml
    permissions:
      contents: read
      attestations: read
  gate:
    needs: build
    if: startsWith(github.event.label.name, 'securefix-')
    runs-on: ubuntu-latest
    environment: main
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/securefix
          merge-multiple: true
      - name: Restore trusted CLI permissions
        run: chmod 700 "$RUNNER_TEMP/securefix/securefix"
      - name: Validate label event and source scope
        id: event
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SECUREFIX_SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
        working-directory: ${{ runner.temp }}/securefix
        run: ./securefix securefix validate-event
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: read-token
        with:
          app-id: 3872533
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: ${{ steps.event.outputs.source_repository }}
          permission-actions: read
          permission-pull-requests: read
          permission-contents: read
      - name: Validate source workflow run and artifact
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_READ_TOKEN: ${{ steps.read-token.outputs.token }}
          SOURCE_REPOSITORY: ${{ steps.event.outputs.source_repository }}
          SOURCE_RUN_ID: ${{ steps.event.outputs.source_run_id }}
          SOURCE_LABEL: ${{ steps.event.outputs.source_label }}
          SECUREFIX_SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
        working-directory: ${{ runner.temp }}/securefix
        run: ./securefix securefix validate-source
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: write-token
        with:
          app-id: 3872533
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: ${{ steps.event.outputs.source_repository }}
          permission-actions: read
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Revalidate source and apply the exact inspected artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_READ_TOKEN: ${{ steps.read-token.outputs.token }}
          SECUREFIX_WRITE_TOKEN: ${{ steps.write-token.outputs.token }}
          SOURCE_REPOSITORY: ${{ steps.event.outputs.source_repository }}
          SOURCE_RUN_ID: ${{ steps.event.outputs.source_run_id }}
          SOURCE_LABEL: ${{ steps.event.outputs.source_label }}
          SECUREFIX_SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
        working-directory: ${{ runner.temp }}/securefix
        run: ./securefix securefix apply
      - name: Consume validated request label
        if: always() && steps.event.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SECUREFIX_SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
        working-directory: ${{ runner.temp }}/securefix
        run: ./securefix securefix cleanup
