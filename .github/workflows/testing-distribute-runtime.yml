name: testing-Distribute Runtime
on:
  workflow_dispatch:
    inputs:
      publisher_run_id:
        description: Exact testing publisher selected by the active isolated descriptor
        type: string
        required: true
permissions: {}
defaults:
  run:
    shell: bash -euo pipefail {0}
jobs:
  host:
    if: github.repository == 'civitaspo/securefix-server' && github.ref == 'refs/heads/main' && github.actor_id == '4525500' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      source-sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          repository: civitaspo/securefix-server
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: $/.github/actions/setup-cli
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: testing-distribution-host
          path: |
            target/release/securefix
            target/release/policy.json
          if-no-files-found: error
          retention-days: 1
  distribute:
    needs: host
    if: github.repository == 'civitaspo/securefix-server' && github.ref == 'refs/heads/main' && github.actor_id == '4525500' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    environment: main
    permissions:
      contents: read
      actions: read
    timeout-minutes: 15
    concurrency:
      group: securefix-control
      cancel-in-progress: false
      queue: max
    env:
      SECUREFIX_TEST_BASELINE_SHA: ${{ needs.host.outputs.source-sha }}
      SECUREFIX_SOURCE_SHA: ${{ needs.host.outputs.source-sha }}
    steps:
      - uses: $/.github/actions/install-actions-lock
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.host.outputs.artifact-id }}
          path: ${{ runner.temp }}/testing-host
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        with:
          binary: ${{ runner.temp }}/testing-host/securefix
      - name: Validate exact trusted distributor before issuing test credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: securefix integration validate-testing-processor --kind caller-distribution
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: read
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: testing-securefix-server
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-statuses: read
      - name: Qualify isolated source, runtime and control as data
        id: runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_TEST_READ_TOKEN: ${{ steps.read.outputs.token }}
        run: securefix integration load-testing-control --kind caller-distribution
      - uses: $/.github/actions/install-cli
        with:
          binary: ${{ steps.runtime.outputs.directory }}/securefix
      - name: Validate publisher and prepare canonical test caller files
        env:
          GITHUB_TOKEN: ${{ steps.read.outputs.token }}
          SECUREFIX_SERVER_TOKEN: ${{ steps.read.outputs.token }}
          SECUREFIX_SOURCE_SHA: ${{ steps.runtime.outputs.source_sha }}
          SECUREFIX_CONTROL_ID: ${{ steps.runtime.outputs.control_id }}
          SECUREFIX_WORKFLOW_SHA: ${{ github.workflow_sha }}
          PUBLISHER: ${{ inputs.publisher_run_id }}
        run: |
          securefix distribute validate-promotion "$PUBLISHER"
          securefix distribute prepare-caller civitaspo/testing-securefix-server caller-migration
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: write
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: testing-securefix-server
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Propose signed canonical migration without merging
        env:
          GITHUB_TOKEN: ${{ steps.read.outputs.token }}
          SECUREFIX_SERVER_TOKEN: ${{ steps.write.outputs.token }}
          SECUREFIX_SOURCE_SHA: ${{ steps.runtime.outputs.source_sha }}
          SECUREFIX_CONTROL_ID: ${{ steps.runtime.outputs.control_id }}
          SECUREFIX_WORKFLOW_SHA: ${{ github.workflow_sha }}
          PUBLISHER: ${{ inputs.publisher_run_id }}
        run: >-
          securefix distribute apply-caller
          --repository civitaspo/testing-securefix-server
          --directory caller-migration --publisher-run-id "$PUBLISHER"
