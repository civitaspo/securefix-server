name: testing-Load CLI

on:
  workflow_call:
    outputs:
      artifact-id:
        description: Immutable artifact ID of the qualified test runtime
        value: ${{ jobs.load.outputs.artifact-id }}
      source-sha:
        description: Exact development source selected by the test control
        value: ${{ jobs.load.outputs.source-sha }}
      control-id:
        description: Canonical identity of the isolated test control
        value: ${{ jobs.load.outputs.control-id }}
      workflow-sha:
        description: Immutable revision defining this reusable workflow
        value: ${{ jobs.load.outputs.workflow-sha }}
permissions: {}
defaults:
  run:
    shell: bash -euo pipefail {0}
jobs:
  load:
    if: >-
      (github.repository == 'civitaspo/testing-securefix-server') ||
      (github.repository == 'civitaspo/securefix-server' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      attestations: read
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      source-sha: ${{ steps.runtime.outputs.source_sha }}
      control-id: ${{ steps.runtime.outputs.control_id }}
      workflow-sha: ${{ job.workflow_sha }}
    steps:
      - name: Capture the protected server baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(gh api repos/civitaspo/securefix-server/commits/main --jq .sha)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: civitaspo/securefix-server
          ref: ${{ steps.baseline.outputs.sha }}
          persist-credentials: false
      - name: Load the source-bound attested development runtime
        id: selected
        uses: ./.github/actions/load-runtime
        with:
          repository: civitaspo/securefix-server
          control-repository: civitaspo/testing-securefix-server
          default-branch: main
          workflow-prefix: testing-
          token: ${{ github.token }}
      - uses: ./.github/actions/install-cli
        with:
          binary: ${{ steps.selected.outputs.directory }}/securefix
      - name: Qualify the pinned pre-release against the isolated control
        id: runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_TEST_BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
          DEFINING_WORKFLOW_SHA: ${{ job.workflow_sha }}
          SECUREFIX_SOURCE_SHA: ${{ steps.selected.outputs.source-sha }}
          SECUREFIX_CONTROL_ID: ${{ steps.selected.outputs.control-id }}
        run: securefix integration load-testing-runtime --workflow-sha "$DEFINING_WORKFLOW_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: testing-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.runtime.outputs.directory }}/
          if-no-files-found: error
          retention-days: 1
