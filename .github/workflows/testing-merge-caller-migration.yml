name: testing-Merge Reviewed Caller Migration

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Exact policy-approved caller repository
        required: true
        type: string
      pull_request:
        description: Server App migration PR number
        required: true
        type: string
      expected_head_sha:
        description: Exact owner-reviewed migration head
        required: true
        type: string
      control_id:
        description: Full active control identity
        required: true
        type: string
      approve_comment_id:
        description: Fresh owner /approve comment after the control-bound review
        required: true
        type: string
      merge_comment_id:
        description: Separate fresh owner /merge comment
        required: true
        type: string
      publisher_run_id:
        description: Verified publisher run selected by the active descriptor
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  host:
    if: github.repository == 'civitaspo/securefix-server' && github.ref == 'refs/heads/main' && github.actor_id == '4525500' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      source-sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          repository: civitaspo/securefix-server
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-cli
      - name: Bundle the reviewed isolated host policy
        run: install -m 644 .github/testing-policy.json target/release/testing-policy.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: testing-migration-host
          path: |
            target/release/securefix
            target/release/policy.json
            target/release/testing-policy.json
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: host
    if: github.repository == 'civitaspo/securefix-server' && github.ref == 'refs/heads/main' && github.actor_id == '4525500' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    environment: main
    permissions:
      contents: read
      actions: read
    timeout-minutes: 15
    concurrency:
      group: securefix-control
      cancel-in-progress: false
      queue: max
    env:
      SECUREFIX_TEST_BASELINE_SHA: ${{ needs.host.outputs.source-sha }}
      SECUREFIX_SOURCE_SHA: ${{ needs.host.outputs.source-sha }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.host.outputs.artifact-id }}
          path: ${{ runner.temp }}/testing-host
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        with:
          binary: ${{ runner.temp }}/testing-host/securefix
      - name: Validate the exact processor before issuing any App token
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: securefix integration validate-testing-processor --kind caller-migration
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: read
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: testing-securefix-server
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-statuses: read
      - name: Qualify the isolated active runtime without executing it
        id: runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_TEST_READ_TOKEN: ${{ steps.read.outputs.token }}
        run: securefix integration load-testing-control --kind caller-migration
      - name: Validate the fixed caller and prepare its canonical reviewed plan
        env:
          GITHUB_TOKEN: ${{ steps.read.outputs.token }}
          SECUREFIX_SERVER_TOKEN: ${{ steps.read.outputs.token }}
          SECUREFIX_POLICY_PATH: ${{ runner.temp }}/testing-host/testing-policy.json
          SECUREFIX_SOURCE_SHA: ${{ steps.runtime.outputs.source_sha }}
          SECUREFIX_CONTROL_ID: ${{ steps.runtime.outputs.control_id }}
          CALLER: ${{ inputs.repository }}
          PR: ${{ inputs.pull_request }}
          HEAD: ${{ inputs.expected_head_sha }}
          CONTROL: ${{ inputs.control_id }}
          APPROVE_COMMENT: ${{ inputs.approve_comment_id }}
          MERGE_COMMENT: ${{ inputs.merge_comment_id }}
          PUBLISHER: ${{ inputs.publisher_run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/testing-operation"
          cd "$RUNNER_TEMP/testing-operation"
          securefix caller-migration target "$CALLER"
          securefix caller-migration prepare "$CALLER" "$PR" "$HEAD" "$CONTROL" "$APPROVE_COMMENT" "$MERGE_COMMENT" "$PUBLISHER"
      - name: Prepare the fixed container launcher without executing the candidate
        env:
          CANDIDATE_DIRECTORY: ${{ steps.runtime.outputs.directory }}
        run: |
          mkdir -p "$RUNNER_TEMP/testing-exec"
          install -m 0555 "$CANDIDATE_DIRECTORY/securefix" "$RUNNER_TEMP/testing-exec/securefix"
          cat > "$RUNNER_TEMP/testing-launcher-input" <<'LAUNCHER'
          #!/usr/bin/env bash
          set -euo pipefail
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" --pids-limit 64 --memory 256m --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m --workdir /operation \
            --mount "type=bind,source=$RUNNER_TEMP/testing-exec/securefix,target=/candidate/securefix,readonly" \
            --mount "type=bind,source=$CANDIDATE_DIRECTORY/policy.json,target=/candidate/policy.json,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/testing-operation,target=/operation,readonly" \
            --mount "type=bind,source=$GITHUB_EVENT_PATH,target=/event.json,readonly" \
            --mount "type=bind,source=/etc/ssl/certs,target=/etc/ssl/certs,readonly" \
            -e SECUREFIX_SERVER_TOKEN -e SECUREFIX_AUTHORIZATION_TOKEN -e SECUREFIX_MERGE_TOKEN \
            -e SECUREFIX_SOURCE_SHA -e SECUREFIX_CONTROL_ID \
            -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_SERVER_URL \
            -e GITHUB_EVENT_NAME -e GITHUB_ACTOR_ID -e GITHUB_REF -e GITHUB_SHA -e GITHUB_WORKFLOW_REF \
            -e GITHUB_EVENT_PATH=/event.json \
            ubuntu@sha256:f610ab94648195aa356059f5b41d6085c9d4d903c072430cdd1af7bdb646106b \
            /candidate/securefix caller-migration "$@"
          LAUNCHER
          install -m 0555 "$RUNNER_TEMP/testing-launcher-input" "$RUNNER_TEMP/testing-run-candidate"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: authorization
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: testing-securefix-server
          permission-checks: write
          permission-issues: write
          permission-pull-requests: write
      - name: Candidate records exact-head control-bound authorization
        env:
          SECUREFIX_SERVER_TOKEN: ${{ steps.read.outputs.token }}
          SECUREFIX_AUTHORIZATION_TOKEN: ${{ steps.authorization.outputs.token }}
          SECUREFIX_SOURCE_SHA: ${{ steps.runtime.outputs.source_sha }}
          SECUREFIX_CONTROL_ID: ${{ steps.runtime.outputs.control_id }}
          CANDIDATE_DIRECTORY: ${{ steps.runtime.outputs.directory }}
        run: '"$RUNNER_TEMP/testing-run-candidate" authorize'
      - name: Candidate revalidates normal checks and owner review before merge-token issuance
        env:
          SECUREFIX_SERVER_TOKEN: ${{ steps.read.outputs.token }}
          SECUREFIX_SOURCE_SHA: ${{ steps.runtime.outputs.source_sha }}
          SECUREFIX_CONTROL_ID: ${{ steps.runtime.outputs.control_id }}
          CANDIDATE_DIRECTORY: ${{ steps.runtime.outputs.directory }}
        run: '"$RUNNER_TEMP/testing-run-candidate" ready'
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: write
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: testing-securefix-server
          permission-contents: write
          permission-pull-requests: write
      - name: Candidate revalidates and merges only the accepted canonical head
        env:
          SECUREFIX_SERVER_TOKEN: ${{ steps.read.outputs.token }}
          SECUREFIX_MERGE_TOKEN: ${{ steps.write.outputs.token }}
          SECUREFIX_SOURCE_SHA: ${{ steps.runtime.outputs.source_sha }}
          SECUREFIX_CONTROL_ID: ${{ steps.runtime.outputs.control_id }}
          CANDIDATE_DIRECTORY: ${{ steps.runtime.outputs.directory }}
        run: '"$RUNNER_TEMP/testing-run-candidate" merge'
