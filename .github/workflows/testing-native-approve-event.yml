name: testing-native-approve-event

on:
  label:
    types: [created]

permissions: {}

jobs:
  handler:
    concurrency:
      group: securefix-control
      cancel-in-progress: false
      queue: max
    if: startsWith(github.event.label.name, 'securefix-native-approve-')
    permissions:
      actions: read
      attestations: read
      contents: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
    uses: civitaspo/securefix-server/.github/workflows/reusable-server-approve.yml@170cc1d6580c8e9041e9ef7ebd6ee1d01642acf9 # v0.2.45-pre.124
    with:
      config_path: repo-settings/native-role-events-test-instance.toml
    secrets:
      SERVER_PRIVATE_KEY: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
      APPROVAL_TOKEN: ${{ secrets.CIVITASPO_BOT_PR_APPROVE_TOKEN }}
