name: testing-native-merge-event

on:
  label:
    types: [created]

permissions: {}

jobs:
  handler:
    concurrency:
      group: securefix-testing-native-control
      cancel-in-progress: false
      queue: max
    if: startsWith(github.event.label.name, 'securefix-native-merge-')
    permissions:
      actions: read
      attestations: read
      contents: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
    uses: civitaspo/securefix-server/.github/workflows/reusable-server-merge.yml@046b97b22622f6ca052836303f1f194018fd51a6 # v0.2.45-pre.69
    with:
      config_path: repo-settings/native-role-events-test-instance.toml
    secrets:
      SERVER_PRIVATE_KEY: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
