name: testing-native-package-build

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    if: github.repository == 'civitaspo/securefix-server' && github.actor_id == '4525500' && github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && github.run_attempt == 1 && github.sha == github.workflow_sha
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Test and build the selected source
        run: |
          cargo +1.99.0 test --locked
          cargo +1.99.0 build --locked --release --bin securefix
      - name: Stage only the raw executable
        run: |
          mkdir -p package
          install -m 755 target/release/securefix package/securefix-linux-x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: native-package-raw-${{ github.run_id }}
          path: package/securefix-linux-x86_64
          if-no-files-found: error
          retention-days: 2

  attest:
    needs: build
    if: needs.build.result == 'success' && github.repository == 'civitaspo/securefix-server' && github.actor_id == '4525500' && github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && github.run_attempt == 1 && github.sha == github.workflow_sha
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: package
          merge-multiple: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attestation
        with:
          subject-path: package/securefix-linux-x86_64
          create-storage-record: false
      - name: Place the signed bundle beside the executable
        env:
          BUNDLE_PATH: ${{ steps.attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -n "$BUNDLE_PATH"
          test -s "$BUNDLE_PATH"
          cp -- "$BUNDLE_PATH" package/bundle.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: native-package-attested
          path: |
            package/securefix-linux-x86_64
            package/bundle.json
          if-no-files-found: error
          retention-days: 2
