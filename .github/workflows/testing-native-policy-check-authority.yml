name: testing-Native policy check authority

on:
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: Exact successful scratch Client policy-check producer run
        required: true
        type: string
      package_publication_json:
        description: Exact owner-selected scratch package publication record JSON
        required: true
        type: string

permissions: {}

concurrency:
  group: native-policy-check-${{ inputs.producer_run_id }}
  cancel-in-progress: false

jobs:
  validate-request:
    if: github.repository == 'civitaspo/securefix-server' && github.ref == 'refs/heads/main' && github.actor_id == '4525500' && github.run_attempt == 1 && github.sha == github.workflow_sha
    runs-on: ubuntu-24.04
    environment: main
    permissions:
      actions: read
      attestations: read
      contents: read
      pull-requests: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Load the exact verified scratch package
        uses: civitaspo/securefix-server/.github/actions/load-package@6be9fb42e14770a9162301787e158f7db3ab918a # v0.2.45-pre.12
        with:
          action-sha: 6be9fb42e14770a9162301787e158f7db3ab918a
          source-repository: civitaspo/securefix-server
          source-repository-id: '1250079425'
          destination-repository: civitaspo/testing-securefix-server
          destination-repository-id: '1410312556'
          source-default-branch: main
          owner-id: '4525500'
          channel: scratch
          manifest-source-sha: 3b88bcd0e228791e355aec238d5c7e95027b3f6f
          publication-source-sha: 3b88bcd0e228791e355aec238d5c7e95027b3f6f
          publication-source-branch: integration/native-package-pre23
          publication-tag: v0.2.45-pre.23
          publication-release-id: '420735040'
          publication-asset-id: '665912019'
          publication-asset-sha256: fd72ab4c2f767aaaf46f8d67537187f0496e4312922e33ef6a8348ec2dac1936
          publication-asset-size: '11767224'
          publication-producer-run-id: '39783133806'
          publication-producer-run-attempt: '1'
          token: ${{ github.token }}
      - name: Confirm the verified package implements the instance writer
        run: securefix new-server instance-policy-check-run --help
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: scratch-reader
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: testing-securefix-server
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
      - name: Validate the attested request and current authority without a writer token
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_CLIENT_TOKEN: ${{ steps.scratch-reader.outputs.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          SECUREFIX_NATIVE_SCRATCH_PACKAGE_PUBLICATION_JSON: ${{ inputs.package_publication_json }}
        run: |
          set -euo pipefail
          [[ "$PRODUCER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SECUREFIX_NATIVE_SCRATCH_PACKAGE_PUBLICATION_JSON" =~ ^\{.*\}$ ]]
          securefix new-server instance-policy-check-run \
            --config-path repo-settings/native-securefix-test-instance.toml \
            --producer-repository civitaspo/testing-securefix-server \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --owner-selected-test-package

  publish-check:
    needs: validate-request
    if: needs.validate-request.result == 'success' && github.repository == 'civitaspo/securefix-server' && github.ref == 'refs/heads/main' && github.actor_id == '4525500' && github.run_attempt == 1 && github.sha == github.workflow_sha
    runs-on: ubuntu-24.04
    environment: main
    permissions:
      actions: read
      attestations: read
      contents: read
      pull-requests: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Load the exact verified scratch package
        uses: civitaspo/securefix-server/.github/actions/load-package@6be9fb42e14770a9162301787e158f7db3ab918a # v0.2.45-pre.12
        with:
          action-sha: 6be9fb42e14770a9162301787e158f7db3ab918a
          source-repository: civitaspo/securefix-server
          source-repository-id: '1250079425'
          destination-repository: civitaspo/testing-securefix-server
          destination-repository-id: '1410312556'
          source-default-branch: main
          owner-id: '4525500'
          channel: scratch
          manifest-source-sha: 3b88bcd0e228791e355aec238d5c7e95027b3f6f
          publication-source-sha: 3b88bcd0e228791e355aec238d5c7e95027b3f6f
          publication-source-branch: integration/native-package-pre23
          publication-tag: v0.2.45-pre.23
          publication-release-id: '420735040'
          publication-asset-id: '665912019'
          publication-asset-sha256: fd72ab4c2f767aaaf46f8d67537187f0496e4312922e33ef6a8348ec2dac1936
          publication-asset-size: '11767224'
          publication-producer-run-id: '39783133806'
          publication-producer-run-attempt: '1'
          token: ${{ github.token }}
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: scratch-reader
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: testing-securefix-server
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: check-writer
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: testing-securefix-server
          permission-checks: write
      - name: Revalidate and publish the exact-head policy check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_CLIENT_TOKEN: ${{ steps.scratch-reader.outputs.token }}
          SECUREFIX_NATIVE_CHECK_TOKEN: ${{ steps.check-writer.outputs.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          SECUREFIX_NATIVE_SCRATCH_PACKAGE_PUBLICATION_JSON: ${{ inputs.package_publication_json }}
        run: |
          set -euo pipefail
          [[ "$PRODUCER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          securefix new-server instance-policy-check-run \
            --config-path repo-settings/native-securefix-test-instance.toml \
            --producer-repository civitaspo/testing-securefix-server \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --owner-selected-test-package \
            --publish
