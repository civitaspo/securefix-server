name: testing-native-policy-check-event

on:
  label:
    types: [created]

permissions: {}

jobs:
  handler:
    if: startsWith(github.event.label.name, 'securefix-native-policy-check-')
    permissions:
      actions: read
      attestations: read
      contents: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
    uses: civitaspo/securefix-server/.github/workflows/reusable-server-policy-check.yml@2719567ddd2cb9e13294e12cb9537780c6643263 # v0.2.45-pre.45
    with:
      config_path: repo-settings/native-role-events-test-instance.toml
    secrets:
      SERVER_PRIVATE_KEY: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
