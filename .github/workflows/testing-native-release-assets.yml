name: testing-Native Release Assets

on:
  workflow_call:
    secrets:
      SECUREFIX_SERVER_PRIVATE_KEY:
        required: true

permissions: {}
defaults:
  run:
    shell: bash -euo pipefail {0}
concurrency:
  group: native-release-assets-probe-${{ github.ref }}
  cancel-in-progress: false

env:
  PROBE_REPOSITORY: civitaspo/testing-securefix-server
  CLIENT_REPOSITORY: civitaspo/herdr-linear-agent
  CLIENT_SOURCE_SHA: ccdaada3efa78ebdef58f2db38aaf6ec5a8c8e00
  CLIENT_SOURCE_PR_NUMBER: '187'

jobs:
  guard:
    if: github.repository == 'civitaspo/securefix-server' && github.actor_id == '4525500' && github.run_attempt == 1 && startsWith(github.ref, 'refs/heads/integration/native-')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      candidate-sha: ${{ steps.guard.outputs.candidate-sha }}
    steps:
      - name: Require the frozen candidate branch to match this run
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate SHA is invalid' >&2; exit 1; }
          [[ "$BRANCH" =~ ^integration/native-[0-9a-f]{12}$ ]] || { echo 'workflow must run from a SHA-named frozen integration branch' >&2; exit 1; }
          [[ "${BRANCH##*-}" == "${CANDIDATE_SHA:0:12}" ]] || { echo 'frozen branch name does not bind this candidate SHA' >&2; exit 1; }
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" --jq .object.sha)"
          [[ "$current" == "$CANDIDATE_SHA" ]] || { echo 'frozen candidate branch moved during dispatch' >&2; exit 1; }
          echo "candidate-sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

  compile-harness:
    needs: guard
    if: needs.guard.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      native-targets: ${{ steps.targets.outputs.native-targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.candidate-sha }}
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Compile the isolated native release probe test binary
        run: |
          cargo +1.99.0 test --locked --bin securefix --no-run --message-format=json > "$RUNNER_TEMP/cargo-test.json"
          binary="$(jq -er 'select(.reason == "compiler-artifact" and .target.name == "securefix" and .profile.test == true and (.target.kind | index("bin")) != null) | .executable' "$RUNNER_TEMP/cargo-test.json")"
          [[ -x "$binary" ]] || { echo 'compiled native release probe test binary is missing' >&2; exit 1; }
          mkdir -p probe
          install -m 755 "$binary" probe/release-probe-tests
          install -m 644 policy.json probe/policy.json
      - name: Read the configured native target matrix
        id: targets
        env:
          CLIENT_REPOSITORY: ${{ env.CLIENT_REPOSITORY }}
        run: |
          targets="$(jq -ce --arg repository "$CLIENT_REPOSITORY" '[.repositories[] | select(.repository == $repository) | .native_binaries[]]' policy.json)"
          [[ "$(jq 'length' <<<"$targets")" == 4 ]] || { echo 'policy does not define four native Client targets' >&2; exit 1; }
          echo "native-targets=$targets" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: native-release-probe-harness-${{ github.run_id }}
          path: probe/
          if-no-files-found: error
          retention-days: 1

  build-native:
    needs: [guard, compile-harness]
    if: needs.guard.result == 'success' && needs.compile-harness.result == 'success'
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.compile-harness.outputs.native-targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CLIENT_REPOSITORY }}
          ref: ${{ env.CLIENT_SOURCE_SHA }}
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install the musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build and execute the pinned Client source on its target runner
        id: target
        env:
          CLIENT_SOURCE_SHA: ${{ env.CLIENT_SOURCE_SHA }}
          CLIENT_SOURCE_PR_NUMBER: ${{ env.CLIENT_SOURCE_PR_NUMBER }}
          NATIVE_TARGET: ${{ matrix.target.target }}
          NATIVE_RUNNER: ${{ matrix.target.runner }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          source_before="$(git rev-parse HEAD)"
          [[ "$source_before" == "$CLIENT_SOURCE_SHA" ]] || { echo 'native build checkout differs from the pinned Client source' >&2; exit 1; }
          package_version="$(git show "$CLIENT_SOURCE_SHA:.release-version" | tr -d '\r\n')"
          [[ -n "$package_version" ]] || { echo 'pinned Client source package version is missing' >&2; exit 1; }
          rustup target add "$NATIVE_TARGET"
          cargo +1.99.0 build --locked --release --bin herdr-linear-agent --target "$NATIVE_TARGET"
          source_after="$(git rev-parse HEAD)"
          [[ "$source_after" == "$CLIENT_SOURCE_SHA" ]] || { echo 'native build changed the pinned Client checkout' >&2; exit 1; }
          binary="target/$NATIVE_TARGET/release/herdr-linear-agent"
          [[ -f "$binary" ]] || { echo 'native build did not produce its binary' >&2; exit 1; }
          version_output="$(env -i PATH="$PATH" "$binary" --version)"
          [[ "$version_output" == "herdr-linear-agent $package_version"+* ]] || { echo 'native binary reports a version that differs from the pinned Client source' >&2; exit 1; }
          artifact_dir="$(mktemp -d "$RUNNER_TEMP/native-target.XXXXXX")"
          echo "artifact_dir=$artifact_dir" >> "$GITHUB_OUTPUT"
          filename="herdr-linear-agent-$NATIVE_TARGET"
          install -m 755 "$binary" "$artifact_dir/$filename"
          jq -n \
            --argjson source_run_id "$GITHUB_RUN_ID" \
            --argjson source_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg source_run_sha "$GITHUB_SHA" \
            --argjson release_pr_number "$CLIENT_SOURCE_PR_NUMBER" \
            --arg release_pr_sha "$CLIENT_SOURCE_SHA" \
            --arg package_version "$package_version" \
            --arg target "$NATIVE_TARGET" \
            --arg runner "$NATIVE_RUNNER" \
            --arg runner_name "$RUNNER_NAME" \
            --arg runner_os "$RUNNER_OS" \
            --arg runner_arch "$RUNNER_ARCH" \
            --arg filename "$filename" \
            --arg version_output "$version_output" \
            '{schema_version:1,source_run_id:$source_run_id,source_run_attempt:$source_run_attempt,source_run_sha:$source_run_sha,release_pr_number:$release_pr_number,release_pr_sha:$release_pr_sha,package_version:$package_version,target:$target,runner:$runner,runner_name:$runner_name,runner_os:$runner_os,runner_arch:$runner_arch,filename:$filename,version_output:$version_output}' \
            > "$artifact_dir/native-target.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-target-${{ matrix.target.target }}-${{ github.run_attempt }}
          path: ${{ steps.target.outputs.artifact_dir }}/*
          if-no-files-found: error
          retention-days: 1

  verify-native-targets:
    needs: [guard, compile-harness, build-native]
    if: needs.guard.result == 'success' && needs.compile-harness.result == 'success' && needs.build-native.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.compile-harness.outputs.artifact-id }}
          path: probe
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: native-target-*-${{ github.run_attempt }}
          path: native-input
      - name: Independently verify current-run native artifacts before any write token exists
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_POLICY_PATH: ${{ github.workspace }}/probe/policy.json
          SECUREFIX_NATIVE_RELEASE_PROBE_CLIENT_SHA: ${{ env.CLIENT_SOURCE_SHA }}
          SECUREFIX_NATIVE_RELEASE_PROBE_INPUT_DIR: ${{ github.workspace }}/native-input
          SECUREFIX_NATIVE_RELEASE_PROBE_OUTPUT_DIR: ${{ runner.temp }}/native-release-probe/evidence
        run: |
          chmod 755 "$GITHUB_WORKSPACE/probe/release-probe-tests"
          "$GITHUB_WORKSPACE/probe/release-probe-tests" --ignored --exact release::tests::native_release_assets_validate_probe_inputs --nocapture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-release-assets-input-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/native-release-probe/evidence/native-release-assets-inputs.json
          if-no-files-found: error
          retention-days: 7

  publish-scratch-prerelease:
    needs: [guard, compile-harness, build-native, verify-native-targets]
    if: needs.guard.result == 'success' && needs.compile-harness.result == 'success' && needs.build-native.result == 'success' && needs.verify-native-targets.result == 'success'
    runs-on: ubuntu-24.04
    environment: main
    permissions:
      actions: read
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.compile-harness.outputs.artifact-id }}
          path: probe
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: native-target-*-${{ github.run_attempt }}
          path: native-input
      - name: Recheck the frozen candidate before validating and minting the scratch token
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.guard.outputs.candidate-sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" --jq .object.sha)"
          [[ "$current" == "$CANDIDATE_SHA" ]] || { echo 'frozen candidate branch moved before scratch publication' >&2; exit 1; }
      - name: Revalidate exact native artifacts before minting the scratch token
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_POLICY_PATH: ${{ github.workspace }}/probe/policy.json
          SECUREFIX_NATIVE_RELEASE_PROBE_CLIENT_SHA: ${{ env.CLIENT_SOURCE_SHA }}
          SECUREFIX_NATIVE_RELEASE_PROBE_INPUT_DIR: ${{ github.workspace }}/native-input
          SECUREFIX_NATIVE_RELEASE_PROBE_OUTPUT_DIR: ${{ runner.temp }}/native-release-probe/prewrite-evidence
        run: |
          chmod 755 "$GITHUB_WORKSPACE/probe/release-probe-tests"
          "$GITHUB_WORKSPACE/probe/release-probe-tests" --ignored --exact release::tests::native_release_assets_validate_probe_inputs --nocapture
      - name: Create a scratch-only Server App token
        id: scratch-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: testing-securefix-server
          permission-contents: write
      - name: Publish the verified native binaries to a scratch prerelease
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_POLICY_PATH: ${{ github.workspace }}/probe/policy.json
          SECUREFIX_SERVER_APP_TOKEN: ${{ steps.scratch-token.outputs.token }}
          SECUREFIX_NATIVE_RELEASE_PROBE_REPOSITORY: ${{ env.PROBE_REPOSITORY }}
          SECUREFIX_NATIVE_RELEASE_PROBE_CLIENT_SHA: ${{ env.CLIENT_SOURCE_SHA }}
          SECUREFIX_NATIVE_RELEASE_PROBE_INPUT_DIR: ${{ github.workspace }}/native-input
          SECUREFIX_NATIVE_RELEASE_PROBE_ASSET_DIR: ${{ runner.temp }}/native-release-probe/assets
          SECUREFIX_NATIVE_RELEASE_PROBE_OUTPUT_DIR: ${{ runner.temp }}/native-release-probe/publish-evidence
        run: |
          chmod 755 "$GITHUB_WORKSPACE/probe/release-probe-tests"
          "$GITHUB_WORKSPACE/probe/release-probe-tests" --ignored --exact release::tests::native_release_assets_scratch_publish_probe --nocapture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-release-assets-probe-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/native-release-probe/publish-evidence/native-release-assets-probe.json
          if-no-files-found: warn
          retention-days: 7
