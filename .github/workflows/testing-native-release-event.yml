name: testing-native-release-event

on:
  label:
    types: [created]

permissions: {}

jobs:
  handler:
    if: startsWith(github.event.label.name, 'testing-securefix-native-release-') || startsWith(github.event.label.name, 'securefix-native-release-prepare-')
    permissions:
      actions: read
      attestations: read
      contents: read
      issues: write
      pull-requests: read
      checks: read
      statuses: read
    uses: civitaspo/securefix-server/.github/workflows/reusable-server-release.yml@84f939b68b82de70554f98c429d65e077ef4a771 # v0.2.45-pre.116
    with:
      config_path: repo-settings/native-role-events-test-instance.toml
    secrets:
      SERVER_PRIVATE_KEY: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
