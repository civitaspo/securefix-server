name: testing-Native Securefix scratch receiver

on:
  workflow_dispatch:
    inputs:
      case:
        description: Apply one request or require a stale request to be rejected without a write
        required: true
        type: choice
        options: [apply, stale-head, stale-config, stale-deployment]
      producer_run_id:
        description: Exact successful Client pull_request_target producer run
        required: true
        type: string
      pull_request_number:
        description: Exact owner-authored PR number in the scratch Client repository
        required: true
        type: string
      expected_current_head_sha:
        description: PR head that must remain unchanged for rejection cases
        required: true
        type: string

permissions: {}

jobs:
  apply:
    if: github.repository == 'civitaspo/securefix-server' && github.actor_id == '4525500' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    environment: main
    permissions:
      actions: read
      contents: read
      pull-requests: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: civitaspo/securefix-server
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Reuse the exact source-bound candidate CLI
        id: candidate
        uses: civitaspo/securefix-server/.github/actions/setup-cli@ee98f4f12f3c32855c95feb3fe75bc2870b88460 # native candidate loader H2 ee98f4f12f3c32855c95feb3fe75bc2870b88460
        with:
          candidate-run-id: '39637183252'
          candidate-source-sha: fe29608a9734b3c19237af540f7df635aadedb53
      - name: Require the exact candidate build artifact
        if: steps.candidate.outputs.reused != 'true'
        run: exit 1
      - name: Verify the selected scratch pull request head
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_current_head_sha }}
        run: |
          set -euo pipefail
          [[ "$PULL_REQUEST_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          pull="$(gh api "repos/civitaspo/testing-securefix-server/pulls/$PULL_REQUEST_NUMBER")"
          jq -e --arg sha "$EXPECTED_HEAD_SHA" '
            .state == "open" and
            .base.repo.full_name == "civitaspo/testing-securefix-server" and
            .base.repo.id == 1410312556 and
            .base.ref == "main" and
            .head.repo.full_name == "civitaspo/testing-securefix-server" and
            .head.repo.id == 1410312556 and
            .head.sha == $sha and
            .user.login == "civitaspo" and
            .user.id == 4525500
          ' <<<"$pull" >/dev/null
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: server
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: testing-securefix-server
          permission-actions: read
          permission-contents: write
          permission-pull-requests: read
      - name: Execute the selected source-bound Securefix request
        env:
          CLI_BINARY: ${{ steps.candidate.outputs.binary }}
          CASE_KIND: ${{ inputs.case }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_CURRENT_HEAD_SHA: ${{ inputs.expected_current_head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_CLIENT_TOKEN: ${{ steps.server.outputs.token }}
          SECUREFIX_WRITE_TOKEN: ${{ steps.server.outputs.token }}
        run: |
          set -euo pipefail
          [[ "$PRODUCER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PULL_REQUEST_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_CURRENT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          command_log="$RUNNER_TEMP/native-securefix-command.log"
          if "$CLI_BINARY" new-server securefix-apply \
            --config repo-settings/native-securefix-test-instance.toml \
            --config-path repo-settings/native-securefix-test-instance.toml \
            --producer-repository civitaspo/testing-securefix-server \
            --producer-run-id "$PRODUCER_RUN_ID" >"$command_log" 2>&1; then
            command_status=0
          else
            command_status=$?
          fi
          {
            printf 'case=%s\ncommand_status=%s\n' "$CASE_KIND" "$command_status"
            if [[ -s "$command_log" ]]; then
              tail -c 8192 "$command_log" | sed -E \
                -e 's/(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]+)/[REDACTED_TOKEN]/g' \
                -e 's/(Bearer[[:space:]]+)[^[:space:]" ]+/\1[REDACTED]/Ig'
            fi
          } > native-securefix-result.txt
          if [[ "$CASE_KIND" == apply ]]; then
            [[ "$command_status" == 0 ]]
          else
            [[ "$command_status" != 0 ]]
            case "$CASE_KIND" in
              stale-head)
                expected_error='native request PR is closed, retargeted, or has a different head or identity'
                ;;
              stale-config|stale-deployment)
                expected_error='native request configuration or caller authority history changed'
                ;;
              *)
                exit 1
                ;;
            esac
            grep -F "$expected_error" "$command_log" >/dev/null
            printf 'expected_rejection=%s\n' "$expected_error" >> native-securefix-result.txt
          fi
      - name: Independently read back the PR and signed commit state
        env:
          GH_TOKEN: ${{ steps.server.outputs.token }}
          CASE_KIND: ${{ inputs.case }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_CURRENT_HEAD_SHA: ${{ inputs.expected_current_head_sha }}
        run: |
          set -euo pipefail
          readback_file=native-securefix-readback.json
          api_error="$RUNNER_TEMP/native-securefix-readback-api-error.log"
          attempts='[]'
          current_head=''
          record_readback() {
            jq -n \
              --arg case "$CASE_KIND" \
              --arg pr "$PULL_REQUEST_NUMBER" \
              --arg stage "$1" \
              --arg reason "$2" \
              --arg head "$current_head" \
              --arg expected "$EXPECTED_CURRENT_HEAD_SHA" \
              --argjson attempts "$attempts" \
              '{case:$case,pull_request:($pr|tonumber),stage:$stage,reason:$reason,current_head:$head,expected_head:$expected,attempts:$attempts}' \
              > "$readback_file"
          }
          record_attempt() {
            attempts="$(jq -cn --argjson previous "$attempts" --argjson attempt "$1" --arg check "$2" --arg reason "$3" '$previous + [{attempt:$attempt,check:$check,reason:$reason}]')"
            record_readback "$2" "$3"
          }
          record_readback readback starting
          printf '%s\n' 'native producer proof fixture' > "$RUNNER_TEMP/native-producer-proof.expected"
          for attempt in 1 2 3 4 5 6; do
            current_head=''
            cache_probe="${GITHUB_RUN_ID}-${attempt}-pull"
            if ! pull="$(gh api -H 'Cache-Control: no-cache' "repos/civitaspo/testing-securefix-server/pulls/$PULL_REQUEST_NUMBER?native_probe=$cache_probe" 2>"$api_error")"; then
              record_attempt "$attempt" pull_request api_unavailable
            elif ! current_head="$(jq -er '.head.sha | strings' <<<"$pull" 2>/dev/null)"; then
              record_attempt "$attempt" pull_request head_missing
            elif [[ "$CASE_KIND" != apply ]]; then
              if [[ "$current_head" == "$EXPECTED_CURRENT_HEAD_SHA" ]]; then
                record_attempt "$attempt" pull_request head_unchanged
                jq -n --arg case "$CASE_KIND" --arg pr "$PULL_REQUEST_NUMBER" --arg head "$current_head" --argjson attempts "$attempts" '{case:$case,pull_request:($pr|tonumber),head_sha:$head,no_write:true,attempts:$attempts}' > "$readback_file"
                exit 0
              fi
              record_attempt "$attempt" pull_request head_changed
              exit 1
            elif [[ "$current_head" == "$EXPECTED_CURRENT_HEAD_SHA" ]]; then
              record_attempt "$attempt" pull_request head_not_advanced
            elif [[ ! "$current_head" =~ ^[0-9a-f]{40}$ ]]; then
              record_attempt "$attempt" pull_request head_invalid
              exit 1
            elif ! jq -e --arg sha "$current_head" '
              .state == "open" and
              .base.ref == "main" and
              .head.sha == $sha and
              .head.repo.id == 1410312556 and
              .head.repo.full_name == "civitaspo/testing-securefix-server" and
              .user.id == 4525500 and
              .user.login == "civitaspo"
            ' <<<"$pull" >/dev/null 2>&1; then
              record_attempt "$attempt" pull_request identity_or_state_mismatch
              exit 1
            else
              cache_probe="${GITHUB_RUN_ID}-${attempt}-commit"
              if ! commit="$(gh api -H 'Cache-Control: no-cache' "repos/civitaspo/testing-securefix-server/commits/$current_head?native_probe=$cache_probe" 2>"$api_error")"; then
                record_attempt "$attempt" commit api_unavailable
              elif ! jq -e --arg parent "$EXPECTED_CURRENT_HEAD_SHA" '
                .commit.verification.verified == true and
                .author.id == 288069019 and
                (.parents | length == 1 and .[0].sha == $parent) and
                (.files | length == 1 and .[0].filename == "native-producer-proof.txt" and .[0].status == "added")
              ' <<<"$commit" >/dev/null 2>&1; then
                record_attempt "$attempt" commit signature_or_commit_shape_not_visible
              else
                cache_probe="${GITHUB_RUN_ID}-${attempt}-content"
                if ! (gh api -H 'Cache-Control: no-cache' "repos/civitaspo/testing-securefix-server/contents/native-producer-proof.txt?ref=$current_head&native_probe=$cache_probe" --jq .content | base64 -d > "$RUNNER_TEMP/native-producer-proof.txt") 2>"$api_error"; then
                  record_attempt "$attempt" file_contents api_or_decode_unavailable
                elif ! cmp -s "$RUNNER_TEMP/native-producer-proof.expected" "$RUNNER_TEMP/native-producer-proof.txt"; then
                  record_attempt "$attempt" file_contents exact_bytes_mismatch
                else
                  record_attempt "$attempt" readback all_invariants_verified
                  jq -n --arg case "$CASE_KIND" --arg pr "$PULL_REQUEST_NUMBER" --arg head "$current_head" --arg parent "$EXPECTED_CURRENT_HEAD_SHA" --argjson attempts "$attempts" '{case:$case,pull_request:($pr|tonumber),commit_sha:$head,parent_sha:$parent,signed:true,added_file:"native-producer-proof.txt",attempts:$attempts}' > "$readback_file"
                  exit 0
                fi
              fi
            fi
            if [[ "$attempt" == 6 ]]; then exit 1; fi
            sleep 1
          done
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-securefix-server-result-${{ github.run_id }}
          path: |
            native-securefix-result.txt
            native-securefix-readback.json
          if-no-files-found: warn
          retention-days: 7
