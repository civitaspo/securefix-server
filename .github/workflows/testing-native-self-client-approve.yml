name: testing-native-self-client-approve

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  request:
    if: >-
      github.repository == 'civitaspo/securefix-server' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event.issue.pull_request && github.event.issue.user.id == 4525500 && github.event.comment.user.id == 4525500 && github.event.comment.body == '/approve' && startsWith(github.event.issue.title, '[testing native self] ')
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      id-token: write
      attestations: write
    uses: civitaspo/securefix-server/.github/workflows/reusable-client-request.yml@bf66565ea834e0fe528f4655806335740afd3348 # v0.2.46
    with:
      operation: approval
      server_repository: civitaspo/securefix-server
      instance_config_path: repo-settings/native-role-events-test-instance.toml
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
