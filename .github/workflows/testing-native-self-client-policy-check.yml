name: testing-native-self-client-policy-check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  request:
    if: >-
      github.repository == 'civitaspo/securefix-server' && github.run_attempt == 1 && github.event.pull_request.user.id == 4525500 && github.event.pull_request.head.repo.id == github.repository_id && startsWith(github.event.pull_request.head.ref, 'testing/native-self-') && startsWith(github.event.pull_request.title, '[testing native self] ')
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      id-token: write
      attestations: write
    uses: civitaspo/securefix-server/.github/workflows/reusable-client-request.yml@170cc1d6580c8e9041e9ef7ebd6ee1d01642acf9 # v0.2.45-pre.124
    with:
      operation: policy_check
      server_repository: civitaspo/securefix-server
      instance_config_path: repo-settings/native-role-events-test-instance.toml
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
