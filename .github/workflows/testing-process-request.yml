name: testing-Process Native Request

on:
  label:
    types: [created]

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  host:
    if: github.repository == 'civitaspo/securefix-server' && github.ref == 'refs/heads/main' && github.event_name == 'label' && github.actor_id == '288068203' && github.event.sender.id == 288068203 && (startsWith(github.event.label.name, 'testing-approve-request-') || startsWith(github.event.label.name, 'testing-merge-request-') || startsWith(github.event.label.name, 'testing-policy-request-')) && github.run_attempt == 1
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      source-sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          repository: civitaspo/securefix-server
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-cli
      - name: Bundle the reviewed isolated host policy
        run: install -m 644 .github/testing-policy.json target/release/testing-policy.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: testing-request-host
          path: |
            target/release/securefix
            target/release/policy.json
            target/release/testing-policy.json
          if-no-files-found: error
          retention-days: 1

  process:
    needs: host
    if: github.repository == 'civitaspo/securefix-server' && github.ref == 'refs/heads/main' && github.event_name == 'label' && github.actor_id == '288068203' && github.event.sender.id == 288068203 && (startsWith(github.event.label.name, 'testing-approve-request-') || startsWith(github.event.label.name, 'testing-merge-request-') || startsWith(github.event.label.name, 'testing-policy-request-')) && github.run_attempt == 1
    runs-on: ubuntu-24.04
    environment: main
    permissions:
      contents: read
      actions: read
      issues: write
    timeout-minutes: 15
    concurrency:
      # Reviews and policy results must be able to finish while merge waits for them.
      group: ${{ startsWith(github.event.label.name, 'testing-merge-request-') && 'securefix-control' || format('testing-request-{0}', github.run_id) }}
      cancel-in-progress: false
      queue: max
    env:
      SECUREFIX_TEST_BASELINE_SHA: ${{ needs.host.outputs.source-sha }}
      SECUREFIX_SOURCE_SHA: ${{ needs.host.outputs.source-sha }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.host.outputs.artifact-id }}
          path: ${{ runner.temp }}/testing-host
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        with:
          binary: ${{ runner.temp }}/testing-host/securefix
      - name: Validate the exact processor before issuing any App token
        id: preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: securefix integration validate-testing-processor
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: read
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: testing-securefix-server
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-statuses: read
      - name: Qualify the isolated active runtime without executing it
        id: runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_TEST_READ_TOKEN: ${{ steps.read.outputs.token }}
        run: securefix integration load-testing-control
      - name: Independently retrieve and validate the native request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_SERVER_TOKEN: ${{ steps.read.outputs.token }}
          SECUREFIX_SOURCE_SHA: ${{ steps.runtime.outputs.source_sha }}
          SECUREFIX_CONTROL_ID: ${{ steps.runtime.outputs.control_id }}
          SECUREFIX_POLICY_PATH: ${{ runner.temp }}/testing-host/testing-policy.json
          REQUEST_KIND: ${{ steps.preflight.outputs.kind }}
          SOURCE_RUN_ID: ${{ steps.preflight.outputs.source_run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/testing-operation"
          cd "$RUNNER_TEMP/testing-operation"
          securefix integration prepare-testing-request --kind "$REQUEST_KIND" --source-run-id "$SOURCE_RUN_ID"
      - name: Create the configured User review with trusted host code
        if: steps.preflight.outputs.kind == 'approve'
        env:
          SECUREFIX_SERVER_TOKEN: ${{ steps.read.outputs.token }}
          SECUREFIX_APPROVE_TOKEN: ${{ secrets.CIVITASPO_BOT_PR_APPROVE_TOKEN }}
          SECUREFIX_SOURCE_SHA: ${{ steps.runtime.outputs.source_sha }}
          SECUREFIX_CONTROL_ID: ${{ steps.runtime.outputs.control_id }}
          SECUREFIX_POLICY_PATH: ${{ runner.temp }}/testing-host/testing-policy.json
        run: |
          cd "$RUNNER_TEMP/testing-operation"
          securefix approve review-for-testing
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: write
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: testing-securefix-server
          permission-checks: write
          permission-issues: write
          permission-pull-requests: write
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.preflight.outputs.kind == 'merge'
        id: merge
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: testing-securefix-server
          permission-contents: write
          permission-pull-requests: write
      - name: Run only the candidate continuation in the isolated container
        env:
          SECUREFIX_SERVER_TOKEN: ${{ steps.read.outputs.token }}
          SECUREFIX_WRITE_TOKEN: ${{ steps.write.outputs.token }}
          SECUREFIX_AUTHORIZATION_TOKEN: ${{ steps.write.outputs.token }}
          SECUREFIX_MERGE_TOKEN: ${{ steps.merge.outputs.token }}
          SECUREFIX_SOURCE_SHA: ${{ steps.runtime.outputs.source_sha }}
          SECUREFIX_CONTROL_ID: ${{ steps.runtime.outputs.control_id }}
          CANDIDATE_DIRECTORY: ${{ steps.runtime.outputs.directory }}
          REQUEST_KIND: ${{ steps.preflight.outputs.kind }}
          SOURCE_RUN_ID: ${{ steps.preflight.outputs.source_run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/testing-exec"
          install -m 0555 "$CANDIDATE_DIRECTORY/securefix" "$RUNNER_TEMP/testing-exec/securefix"
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" --pids-limit 64 --memory 256m --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m --workdir /operation \
            --mount "type=bind,source=$RUNNER_TEMP/testing-exec/securefix,target=/candidate/securefix,readonly" \
            --mount "type=bind,source=$CANDIDATE_DIRECTORY/policy.json,target=/candidate/policy.json,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/testing-operation,target=/operation,readonly" \
            --mount "type=bind,source=/etc/ssl/certs,target=/etc/ssl/certs,readonly" \
            -e SECUREFIX_SERVER_TOKEN -e SECUREFIX_WRITE_TOKEN -e SECUREFIX_AUTHORIZATION_TOKEN -e SECUREFIX_MERGE_TOKEN \
            -e SECUREFIX_SOURCE_SHA -e SECUREFIX_CONTROL_ID \
            -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_SERVER_URL \
            ubuntu@sha256:f610ab94648195aa356059f5b41d6085c9d4d903c072430cdd1af7bdb646106b \
            /candidate/securefix integration continue-testing-request --kind "$REQUEST_KIND" --source-run-id "$SOURCE_RUN_ID"
      - name: Delete only this validated testing request label with trusted host code
        if: always() && steps.preflight.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: securefix integration cleanup-testing-request
