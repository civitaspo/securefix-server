name: testing-Publish Runtime

on:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  validator:
    if: github.repository == 'civitaspo/securefix-server' && github.ref == 'refs/heads/main' && github.actor_id == '4525500' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      source-sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          repository: civitaspo/securefix-server
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-cli
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: testing-publication-validator
          path: |
            target/release/securefix
            target/release/policy.json
          if-no-files-found: error
          retention-days: 1

  build:
    if: github.repository == 'civitaspo/securefix-server' && github.ref == 'refs/heads/main' && github.actor_id == '4525500' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      source-sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          repository: civitaspo/securefix-server
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-cli
      - name: Assemble candidate with its reviewed testing policy
        run: |
          install -Dm755 target/release/securefix runtime/securefix
          install -m644 .github/testing-policy.json runtime/policy.json
          mkdir distribution
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf distribution/securefix-runtime-linux-x86_64.tar.gz -C runtime .
      - name: Attest the testing archive without executing it
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: distribution/securefix-runtime-linux-x86_64.tar.gz
          create-storage-record: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: testing-runtime-archive
          path: distribution/
          if-no-files-found: error
          retention-days: 1

  controller:
    if: github.repository == 'civitaspo/securefix-server' && github.ref == 'refs/heads/main' && github.actor_id == '4525500' && github.run_attempt == 1
    uses: ./.github/workflows/load-cli.yml
    permissions:
      actions: read
      contents: read
      attestations: read

  publish:
    needs: [validator, build, controller]
    if: github.repository == 'civitaspo/securefix-server' && github.ref == 'refs/heads/main' && github.actor_id == '4525500' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    environment: main
    permissions:
      contents: write
      attestations: read
    timeout-minutes: 5
    concurrency:
      group: securefix-control
      cancel-in-progress: false
      queue: max
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      SECUREFIX_SOURCE_SHA: ${{ needs.controller.outputs.source-sha }}
      SECUREFIX_CONTROL_ID: ${{ needs.controller.outputs.control-id }}
      SECUREFIX_WORKFLOW_SHA: ${{ needs.controller.outputs.workflow-sha }}
      SECUREFIX_TEST_BASELINE_SHA: ${{ needs.validator.outputs.source-sha }}
      CANDIDATE_SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: distribution
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.validator.outputs.artifact-id }}
          path: ${{ runner.temp }}/testing-validator
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.controller.outputs.artifact-id }}
          path: ${{ runner.temp }}/active-controller
          merge-multiple: true
      - name: Verify exact testing publisher attestation
        run: >-
          gh attestation verify distribution/securefix-runtime-linux-x86_64.tar.gz
          --repo civitaspo/securefix-server
          --source-digest "$CANDIDATE_SOURCE_SHA"
          --source-ref refs/heads/main
          --signer-workflow civitaspo/securefix-server/.github/workflows/testing-publish-runtime.yml
          --signer-digest "$CANDIDATE_SOURCE_SHA"
          --cert-oidc-issuer https://token.actions.githubusercontent.com
          --predicate-type https://slsa.dev/provenance/v1
          --deny-self-hosted-runners
      - uses: $/.github/actions/install-cli
        with:
          binary: ${{ runner.temp }}/testing-validator/securefix
      - name: Qualify the pre-release as data with the captured trusted validator
        run: securefix integration validate-testing-publication --source-sha "$CANDIDATE_SOURCE_SHA" --archive distribution/securefix-runtime-linux-x86_64.tar.gz
      - uses: $/.github/actions/install-cli
        with:
          binary: ${{ runner.temp }}/active-controller/securefix
      - name: Publish with the stable active controller
        run: securefix runtime publish --source-sha "$CANDIDATE_SOURCE_SHA" --archive distribution/securefix-runtime-linux-x86_64.tar.gz
