name: testing-Reusable Release PR Sync

on:
  workflow_call:
    inputs:
      server_repository:
        description: Authenticated Server instance repository locator
        required: true
        type: string
      instance_config_path:
        description: Root-relative protected Server instance TOML path
        required: true
        type: string
permissions: {}
jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      attestations: read
      pull-requests: write
    timeout-minutes: 10
    steps:
      - name: Load the fixed Securefix package
        id: package
        uses: civitaspo/securefix-server/.github/actions/load-package@b00b2080d5be9fe35ece19ee63d064f45997c1ca # v0.2.45-pre.85
        with:
          token: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Sync only the exact Server-owned release PR title and summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          SECUREFIX_SERVER_REPOSITORY: ${{ inputs.server_repository }}
          SECUREFIX_INSTANCE_CONFIG_PATH: ${{ inputs.instance_config_path }}
          CLI_BINARY: ${{ steps.package.outputs.binary }}
        run: |
          set -euo pipefail
          "$CLI_BINARY" release sync-pr
