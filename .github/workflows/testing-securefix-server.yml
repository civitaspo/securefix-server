name: Test Candidate Runtime

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full reviewed candidate SHA; empty uses this workflow revision
        type: string
        default: ''
      phase:
        description: Prepare scratch fixtures or verify owner-authorized outcomes
        type: choice
        options: [prepare, verify]
        default: prepare
      fixture_run_id:
        description: Successful prepare run whose binary and state are reused
        type: string
        default: ''
      client_runtime:
        description: Test the client Action with a candidate artifact or published runtime
        type: choice
        options: [candidate-artifact, published-release]
        default: candidate-artifact
      approval_fixture_pr:
        description: Owner-authored disposable scratch PR for the approval core probe
        type: string
        default: ''
      approval_fixture_head:
        description: Exact signed head of the owner-authored approval fixture
        type: string
        default: ''

permissions: {}

concurrency:
  group: candidate-integration
  cancel-in-progress: false

jobs:
  trusted-runtime-main:
    if: github.repository == 'civitaspo/securefix-server' && github.actor_id == '4525500' && github.run_attempt == 1 && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/load-cli.yml
    permissions:
      contents: read
      attestations: read

  trusted-build:
    if: github.repository == 'civitaspo/securefix-server' && github.actor_id == '4525500' && github.run_attempt == 1 && startsWith(github.ref, 'refs/heads/integration/native-') && (inputs.candidate_sha == '' || inputs.candidate_sha == github.sha)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: civitaspo/securefix-server
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-cli
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: trusted-runtime
          path: |
            target/release/securefix
            target/release/policy.json
          if-no-files-found: error
          retention-days: 7

  build:
    if: github.repository == 'civitaspo/securefix-server' && github.actor_id == '4525500' && github.run_attempt == 1 && (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/heads/integration/native-') && (inputs.candidate_sha == '' || inputs.candidate_sha == github.sha))) && inputs.phase == 'prepare'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      source-sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          repository: civitaspo/securefix-server
          ref: ${{ inputs.candidate_sha || job.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-cli
      - name: Test candidate without credentials
        run: cargo +1.99.0 test --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: candidate-runtime
          path: |
            target/release/securefix
            target/release/policy.json
          if-no-files-found: error
          retention-days: 7

  reuse:
    needs: [trusted-build, trusted-runtime-main]
    if: always() && github.repository == 'civitaspo/securefix-server' && github.actor_id == '4525500' && github.run_attempt == 1 && (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/heads/integration/native-') && (inputs.candidate_sha == '' || inputs.candidate_sha == github.sha))) && inputs.phase == 'verify' && (needs.trusted-build.result == 'success' || needs.trusted-runtime-main.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    timeout-minutes: 5
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      source-sha: ${{ inputs.candidate_sha || job.workflow_sha }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.trusted-runtime-main.outputs.artifact-id || needs.trusted-build.outputs.artifact-id }}
          path: trusted-runtime
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        with:
          binary: trusted-runtime/securefix
      - name: Validate producer and download candidate runtime
        id: state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || job.workflow_sha }}
          FIXTURE_RUN_ID: ${{ inputs.fixture_run_id }}
        run: $RUNNER_TEMP/securefix-bin/securefix integration fetch-state --candidate-sha "$CANDIDATE_SHA" --run-id "$FIXTURE_RUN_ID" --state-file fixtures/state.json
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ steps.state.outputs.candidate_artifact_id }}
          repository: civitaspo/securefix-server
          run-id: ${{ inputs.fixture_run_id }}
          github-token: ${{ github.token }}
          path: candidate-runtime
          merge-multiple: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: candidate-runtime
          path: |
            candidate-runtime/securefix
            candidate-runtime/policy.json
          if-no-files-found: error
          retention-days: 7

  client-smoke:
    needs: [trusted-build, trusted-runtime-main, build]
    if: always() && inputs.phase == 'prepare' && needs.build.result == 'success' && (needs.trusted-build.result == 'success' || needs.trusted-runtime-main.result == 'success')
    runs-on: ubuntu-24.04
    environment: main
    permissions:
      actions: read
      contents: read
      attestations: read
    timeout-minutes: 10
    env:
      CANDIDATE_SHA: ${{ needs.build.outputs.source-sha }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.trusted-runtime-main.outputs.artifact-id || needs.trusted-build.outputs.artifact-id }}
          path: trusted-runtime
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        with:
          binary: trusted-runtime/securefix
      - name: Validate the defining workflow before minting client credentials
        id: producer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: securefix integration validate-producer --workflow-sha "$WORKFLOW_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: civitaspo/securefix-server
          ref: ${{ needs.build.outputs.source-sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        if: inputs.client_runtime == 'candidate-artifact'
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: candidate-runtime
          merge-multiple: true
      - name: Prepare the trusted scratch deployment and client input
        run: securefix integration prepare-client-input
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: client
        with:
          app-id: '3872492'
          private-key: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
          owner: civitaspo
          repositories: testing-securefix-server
          permission-issues: write
      - uses: ./candidate/.github/actions/client
        id: request
        with:
          runtime-sha: ${{ inputs.client_runtime == 'candidate-artifact' && needs.build.outputs.source-sha || steps.producer.outputs.published_runtime_sha }}
          runtime-directory: ${{ inputs.client_runtime == 'candidate-artifact' && 'candidate-runtime' || '' }}
          runtime-repository: civitaspo/securefix-server
          runtime-default-branch: main
          server-repository: civitaspo/testing-securefix-server
          client-token: ${{ steps.client.outputs.token }}
          policy-path: scratch-policy.json
          files: .securefix-client-smoke/request.txt
          repository: civitaspo/testing-securefix-server
          branch: securefix-client-smoke-${{ github.run_id }}
          commit-message: 'test: Securefix client Action'
      - uses: $/.github/actions/install-cli
        with:
          binary: trusted-runtime/securefix
      - name: Verify the real client artifact and scratch request label
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_CLIENT_APP_TOKEN: ${{ steps.client.outputs.token }}
          ARTIFACT_NAME: ${{ steps.request.outputs.artifact-name }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: securefix integration verify-client --artifact-name "$ARTIFACT_NAME" --run-id "$GITHUB_RUN_ID" --workflow-sha "$WORKFLOW_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-verification
          path: client-verification.json
          if-no-files-found: error
          retention-days: 7

  scratch:
    needs: [trusted-build, trusted-runtime-main, build, reuse]
    if: always() && github.repository == 'civitaspo/securefix-server' && github.actor_id == '4525500' && github.run_attempt == 1 && (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/heads/integration/native-') && (inputs.candidate_sha == '' || inputs.candidate_sha == github.sha))) && (needs.build.result == 'success' || needs.reuse.result == 'success') && (needs.trusted-build.result == 'success' || needs.trusted-runtime-main.result == 'success')
    runs-on: ubuntu-24.04
    environment: main
    permissions:
      actions: read
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.trusted-runtime-main.outputs.artifact-id || needs.trusted-build.outputs.artifact-id }}
          path: trusted-runtime
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        with:
          binary: trusted-runtime/securefix
      - name: Validate the defining workflow before minting credentials
        id: producer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: $RUNNER_TEMP/securefix-bin/securefix integration validate-producer --workflow-sha "$WORKFLOW_SHA"
      - name: Validate fixture state with trusted runtime
        if: inputs.phase == 'verify'
        id: state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.build.outputs.source-sha || inputs.candidate_sha || job.workflow_sha }}
          FIXTURE_RUN_ID: ${{ inputs.fixture_run_id }}
          SECUREFIX_PUBLISHED_RUNTIME_SHA: ${{ steps.producer.outputs.published_runtime_sha }}
        run: $RUNNER_TEMP/securefix-bin/securefix integration fetch-state --candidate-sha "$CANDIDATE_SHA" --run-id "$FIXTURE_RUN_ID" --state-file fixtures/state.json
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id || needs.reuse.outputs.artifact-id }}
          path: candidate-runtime
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        with:
          binary: candidate-runtime/securefix
      # The `main` environment must restrict access to main and the manually approved,
      # immutable integration/native-<workflow SHA prefix> bootstrap branch only.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: server
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: testing-securefix-server
          permission-actions: read
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: client
        with:
          app-id: '3872492'
          private-key: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
          owner: civitaspo
          repositories: testing-securefix-server
          permission-issues: write
      - name: Execute candidate against the isolated scratch repository
        id: execute
        env:
          SECUREFIX_SERVER_APP_TOKEN: ${{ steps.server.outputs.token }}
          SECUREFIX_CLIENT_APP_TOKEN: ${{ steps.client.outputs.token }}
          SECUREFIX_TEST_WORKFLOW_SHA: ${{ job.workflow_sha }}
          SECUREFIX_PUBLISHED_RUNTIME_SHA: ${{ steps.producer.outputs.published_runtime_sha }}
          CANDIDATE_SHA: ${{ needs.build.outputs.source-sha || needs.reuse.outputs.source-sha }}
          TEST_PHASE: ${{ inputs.phase }}
          SECUREFIX_APPROVAL_FIXTURE_PR: ${{ inputs.approval_fixture_pr }}
          SECUREFIX_APPROVAL_FIXTURE_HEAD: ${{ inputs.approval_fixture_head }}
        run: |
          mkdir -p fixtures
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" --pids-limit 64 --memory 256m --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m --workdir /fixtures \
            --mount "type=bind,source=$RUNNER_TEMP/securefix-bin/securefix,target=/usr/local/bin/securefix,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/securefix-bin/policy.json,target=/usr/local/bin/policy.json,readonly" \
            --mount "type=bind,source=$PWD/fixtures,target=/fixtures" \
            --mount "type=bind,source=/etc/ssl/certs,target=/etc/ssl/certs,readonly" \
            -e SECUREFIX_SERVER_APP_TOKEN -e SECUREFIX_CLIENT_APP_TOKEN -e SECUREFIX_TEST_WORKFLOW_SHA -e SECUREFIX_PUBLISHED_RUNTIME_SHA \
            -e SECUREFIX_APPROVAL_FIXTURE_PR -e SECUREFIX_APPROVAL_FIXTURE_HEAD \
            -e GITHUB_REF -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_SERVER_URL \
            ubuntu@sha256:f610ab94648195aa356059f5b41d6085c9d4d903c072430cdd1af7bdb646106b \
            securefix integration run --phase "$TEST_PHASE" --candidate-sha "$CANDIDATE_SHA" --state-file state.json
      - uses: $/.github/actions/install-cli
        if: always() && steps.execute.outcome == 'success'
        with:
          binary: trusted-runtime/securefix
      - name: Validate candidate output files with the trusted runtime
        id: validate-outputs
        if: always() && steps.execute.outcome == 'success'
        env:
          CANDIDATE_SHA: ${{ needs.build.outputs.source-sha || needs.reuse.outputs.source-sha }}
          TEST_PHASE: ${{ inputs.phase }}
          SECUREFIX_PUBLISHED_RUNTIME_SHA: ${{ steps.producer.outputs.published_runtime_sha }}
        run: securefix integration validate-outputs --candidate-sha "$CANDIDATE_SHA" --phase "$TEST_PHASE" --state-file fixtures/state.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.validate-outputs.outcome == 'success'
        with:
          name: scratch-fixtures
          path: |
            fixtures/state.json
            fixtures/verification.json
          if-no-files-found: error
          retention-days: 7
