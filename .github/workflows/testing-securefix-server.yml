name: testing-Candidate Runtime

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full reviewed candidate SHA; empty uses this workflow revision
        type: string
        default: ''
      phase:
        description: Build a candidate artifact without scratch writes, prepare/verify Securefix fixtures, reconcile managed scratch files, run the legacy bootstrap probe, or exercise provider and native release scratch probes
        type: choice
        options: [candidate-artifact, prepare, verify, bootstrap, provider, release-assets, managed-files]
        default: prepare
      fixture_run_id:
        description: Successful prepare run whose exact-source fixture state is reused
        type: string
        default: ''
      approval_fixture_pr:
        description: Owner-authored disposable scratch PR for the approval core probe
        type: string
        default: ''
      approval_fixture_head:
        description: Exact signed head of the owner-authored approval fixture
        type: string
        default: ''
      client_repository:
        description: Owner-selected Client repository for this scratch-only probe; provenance is not qualified here
        type: string
        default: ''
      client_implementation_sha:
        description: Full owner-selected Client reusable-release-tag SHA for this scratch-only probe
        type: string
        default: ''
      client_version:
        description: Owner-selected SemVer label for the scratch-only pin comment; provenance is not qualified here
        type: string
        default: ''

permissions: {}

concurrency:
  group: candidate-integration
  cancel-in-progress: false

jobs:
  bootstrap-host:
    if: inputs.phase == 'bootstrap' && github.repository == 'civitaspo/securefix-server' && github.ref == 'refs/heads/main' && github.actor_id == '4525500' && github.run_attempt == 1
    uses: ./.github/workflows/build-bootstrap-host.yml
    permissions:
      contents: read

  bootstrap-legacy-runtime:
    if: inputs.phase == 'bootstrap' && github.repository == 'civitaspo/securefix-server' && github.actor_id == '4525500' && github.run_attempt == 1 && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    timeout-minutes: 5
    steps:
      - name: Download and verify the pinned legacy runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=civitaspo/securefix-server
          release="$(gh api "repos/$repo/releases/414653308")"
          [[ "$(jq -r '.id' <<<"$release")" == 414653308 ]]
          [[ "$(jq -r '.tag_name' <<<"$release")" == v0.2.20 ]]
          asset="$(jq -c '.assets[] | select(.id == 646481902)' <<<"$release")"
          [[ "$(jq -r '.name' <<<"$asset")" == securefix-runtime-linux-x86_64.tar.gz ]]
          [[ "$(jq -r '.size' <<<"$asset")" == 3964894 ]]
          mkdir -p bootstrap-legacy-runtime
          gh release download v0.2.20 --repo "$repo" --pattern securefix-runtime-linux-x86_64.tar.gz --dir bootstrap-legacy-runtime
          cd bootstrap-legacy-runtime
          echo '1f0f991e766e287b1ff55cf8cbda05982c0ddb90295f988081bf5b85a480d96c  securefix-runtime-linux-x86_64.tar.gz' | sha256sum --check
          gh attestation verify securefix-runtime-linux-x86_64.tar.gz --repo "$repo" --source-digest e8e2bc77d96a4e359417217f1d1c22f4e1ac4483 --source-ref refs/heads/main --signer-workflow civitaspo/securefix-server/.github/workflows/publish-runtime.yml --signer-digest e8e2bc77d96a4e359417217f1d1c22f4e1ac4483 --cert-oidc-issuer https://token.actions.githubusercontent.com --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners
          tar -xzf securefix-runtime-linux-x86_64.tar.gz
          ./securefix runtime verify --source-sha e8e2bc77d96a4e359417217f1d1c22f4e1ac4483 --repository civitaspo/securefix-server --archive securefix-runtime-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: control-bootstrap-legacy-runtime
          path: |
            bootstrap-legacy-runtime/securefix
            bootstrap-legacy-runtime/policy.json
          if-no-files-found: error
          retention-days: 1

  bootstrap-scratch:
    if: inputs.phase == 'bootstrap' && github.repository == 'civitaspo/securefix-server' && github.actor_id == '4525500' && github.run_attempt == 1 && github.ref == 'refs/heads/main' && (inputs.candidate_sha == '' || inputs.candidate_sha == github.sha)
    needs: [bootstrap-legacy-runtime, build, bootstrap-host]
    runs-on: ubuntu-24.04
    environment: main
    permissions:
      actions: read
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: civitaspo/securefix-server
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: candidate-runtime
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        with:
          binary: candidate-runtime/securefix
      - uses: $/.github/actions/install-actions-lock
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.bootstrap-host.outputs.artifact-id }}
          path: bootstrap-host
          merge-multiple: true
      - name: Install the fixed Rust bootstrap host
        run: install -D -m 755 bootstrap-host/securefix-bootstrap "$RUNNER_TEMP/securefix-bootstrap"
      - name: Validate current main and inactive descriptor before credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: '"$RUNNER_TEMP/securefix-bootstrap" validate-legacy-context --source-sha "$SOURCE_SHA"'
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: server
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: testing-securefix-server
          permission-actions: read
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: client
        with:
          app-id: '3872492'
          private-key: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
          owner: civitaspo
          repositories: testing-securefix-server
          permission-issues: write
      - name: Prepare scratch fixtures with the candidate runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_SERVER_APP_TOKEN: ${{ steps.server.outputs.token }}
          SECUREFIX_CLIENT_APP_TOKEN: ${{ steps.client.outputs.token }}
          SECUREFIX_TEST_WORKFLOW_SHA: ${{ github.workflow_sha }}
          SECUREFIX_PUBLISHED_RUNTIME_SHA: e8e2bc77d96a4e359417217f1d1c22f4e1ac4483
          SECUREFIX_PUBLISHED_RUNTIME_TAG: v0.2.20
          CANDIDATE_SHA: ${{ needs.build.outputs.source-sha }}
        run: |
          set -euo pipefail
          mkdir -p fixtures control-probe
          (cd fixtures && securefix integration run --phase prepare --candidate-sha "$CANDIDATE_SHA" --state-file state.json)

      - name: Probe candidate control generation and CAS before approval
        env:
          SECUREFIX_SERVER_APP_TOKEN: ${{ steps.server.outputs.token }}
          SECUREFIX_TEST_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CANDIDATE_SHA: ${{ needs.build.outputs.source-sha }}
        run: |
          (cd control-probe && securefix integration control-probe --candidate-sha "$CANDIDATE_SHA" --state-file control-verification.json)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: control-probe
          path: control-probe/control-verification.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bootstrap-fixture-heads
          path: fixtures/state.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish pre-approval scratch identities
        run: |
          printf '## Bootstrap scratch proof\n\nGeneration-one control probe and fixture pull-request heads are available as run artifacts before owner approval.\n\n### Control probe\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat control-probe/control-verification.json >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n\n### Fixture pull-request heads\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat fixtures/state.json >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Execute candidate verification against isolated scratch fixtures
        env:
          SECUREFIX_SERVER_APP_TOKEN: ${{ steps.server.outputs.token }}
          SECUREFIX_CLIENT_APP_TOKEN: ${{ steps.client.outputs.token }}
          SECUREFIX_TEST_WORKFLOW_SHA: ${{ github.workflow_sha }}
          SECUREFIX_PUBLISHED_RUNTIME_SHA: e8e2bc77d96a4e359417217f1d1c22f4e1ac4483
          SECUREFIX_PUBLISHED_RUNTIME_TAG: v0.2.20
          CANDIDATE_SHA: ${{ needs.build.outputs.source-sha }}
        run: |
          (cd fixtures && securefix integration run --phase verify --candidate-sha "$CANDIDATE_SHA" --state-file state.json)
      - name: Validate scratch outputs with the fixed Rust bootstrap host
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
        run: '"$RUNNER_TEMP/securefix-bootstrap" validate-scratch-outputs --source-sha "$SOURCE_SHA" --published-runtime-sha e8e2bc77d96a4e359417217f1d1c22f4e1ac4483 --state-directory fixtures --probe-directory control-probe'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scratch-fixtures
          path: |
            fixtures/state.json
            fixtures/verification.json
          if-no-files-found: error
          retention-days: 7

  baseline:
    if: inputs.phase != 'provider' && inputs.phase != 'bootstrap' && github.repository == 'civitaspo/securefix-server' && github.actor_id == '4525500' && github.run_attempt == 1 && (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/heads/integration/native-') && (inputs.candidate_sha == '' || inputs.candidate_sha == github.sha)))
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    timeout-minutes: 20
    outputs:
      source-sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Capture the current default-branch source
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=civitaspo/securefix-server
          metadata="$(gh api "repos/$repo")"
          [[ "$(jq -r '.full_name' <<<"$metadata")" == "$repo" ]] || { echo 'unexpected server repository identity' >&2; exit 1; }
          [[ "$(jq -r '.default_branch' <<<"$metadata")" == main ]] || { echo 'server default branch changed' >&2; exit 1; }
          commit="$(gh api "repos/$repo/commits/main")"
          [[ "$(jq -r '.commit.verification.verified' <<<"$commit")" == true ]] || { echo 'baseline main signature is not verified' >&2; exit 1; }
          sha="$(jq -r .sha <<<"$commit")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'default branch did not resolve to a full SHA' >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  build:
    if: github.repository == 'civitaspo/securefix-server' && github.actor_id == '4525500' && github.run_attempt == 1 && (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/heads/integration/native-') && (inputs.candidate_sha == '' || inputs.candidate_sha == github.sha))) && (inputs.phase == 'candidate-artifact' || inputs.phase == 'prepare' || inputs.phase == 'verify' || inputs.phase == 'bootstrap' || inputs.phase == 'managed-files') && (inputs.phase != 'bootstrap' || inputs.candidate_sha == '' || inputs.candidate_sha == github.sha)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      source-sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          repository: civitaspo/securefix-server
          ref: ${{ inputs.candidate_sha || job.workflow_sha }}
          persist-credentials: false
      - uses: $/.github/actions/setup-cli
        id: setup-cli
        with:
          candidate-run-id: ${{ inputs.phase == 'verify' && inputs.fixture_run_id || '' }}
      - name: Test candidate without credentials
        if: steps.setup-cli.outputs.reused != 'true'
        run: cargo +1.99.0 test --locked
      - name: Assemble source-bound candidate runtime
        env:
          SOURCE_SHA: ${{ steps.checkout.outputs.commit }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          mkdir -p candidate-runtime
          install -m 755 target/release/securefix candidate-runtime/securefix
          install -m 644 target/release/policy.json candidate-runtime/policy.json
          printf '{"source_sha":"%s","workflow_sha":"%s","platform":"ubuntu-24.04-x86_64","rust":"1.99.0","profile":"release","locked":true}\n' \
            "$SOURCE_SHA" "$WORKFLOW_SHA" > candidate-runtime/build.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: candidate-runtime
          path: candidate-runtime/
          if-no-files-found: error
          retention-days: 7

  scratch:
    needs: [baseline, build]
    if: always() && (inputs.phase == 'prepare' || inputs.phase == 'verify') && github.repository == 'civitaspo/securefix-server' && github.actor_id == '4525500' && github.run_attempt == 1 && (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/heads/integration/native-') && (inputs.candidate_sha == '' || inputs.candidate_sha == github.sha))) && needs.build.result == 'success' && needs.baseline.result == 'success'
    runs-on: ubuntu-24.04
    environment: main
    permissions:
      actions: read
      contents: read
    timeout-minutes: 15
    env:
      SECUREFIX_TEST_BASELINE_SHA: ${{ needs.baseline.outputs.source-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: civitaspo/securefix-server
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: candidate-runtime
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        with:
          binary: candidate-runtime/securefix
      - uses: $/.github/actions/install-actions-lock
      - name: Validate the defining workflow before minting credentials
        id: producer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          "$RUNNER_TEMP/securefix-bin/securefix" integration validate-producer --workflow-sha "$WORKFLOW_SHA"
      - name: Validate fixture state with selected runtime
        if: inputs.phase == 'verify'
        id: state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.build.outputs.source-sha }}
          FIXTURE_RUN_ID: ${{ inputs.fixture_run_id }}
          SECUREFIX_PUBLISHED_RUNTIME_SHA: ${{ steps.producer.outputs.published_runtime_sha }}
        run: |
          "$RUNNER_TEMP/securefix-bin/securefix" integration fetch-state --candidate-sha "$CANDIDATE_SHA" --run-id "$FIXTURE_RUN_ID" --state-file fixtures/state.json
      - name: Resolve the exact published baseline tag
        id: runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHED_RUNTIME_SHA: ${{ steps.producer.outputs.published_runtime_sha }}
        run: securefix integration resolve-test-runtime --published-runtime-sha "$PUBLISHED_RUNTIME_SHA"
      - name: Bind resolved metadata to fixture validation
        env:
          PRODUCER_SHA: ${{ steps.producer.outputs.published_runtime_sha }}
          PRODUCER_TAG: ${{ steps.producer.outputs.published_runtime_tag }}
          STATE_SHA: ${{ steps.state.outputs.published_runtime_sha }}
          STATE_TAG: ${{ steps.state.outputs.published_runtime_tag }}
          RESOLVED_SHA: ${{ steps.runtime.outputs.published_runtime_sha }}
          RESOLVED_TAG: ${{ steps.runtime.outputs.published_runtime_tag }}
        run: |
          set -euo pipefail
          [[ "$RESOLVED_SHA" == "$PRODUCER_SHA" ]] || { echo 'resolved runtime SHA differs from trusted producer' >&2; exit 1; }
          [[ -z "$STATE_SHA" || "$STATE_SHA" == "$PRODUCER_SHA" ]] || { echo 'fixture state resolved a different published runtime SHA' >&2; exit 1; }
          [[ -z "$PRODUCER_TAG" || "$RESOLVED_TAG" == "$PRODUCER_TAG" ]] || { echo 'resolved runtime tag differs from trusted producer' >&2; exit 1; }
          [[ -z "$STATE_TAG" || "$RESOLVED_TAG" == "$STATE_TAG" ]] || { echo 'resolved runtime tag differs from trusted fixture validation' >&2; exit 1; }
      # The `main` environment must restrict access to main and the manually approved,
      # immutable integration/native-<workflow SHA prefix> bootstrap branch only.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: server
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: testing-securefix-server
          permission-actions: read
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: client
        with:
          app-id: '3872492'
          private-key: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
          owner: civitaspo
          repositories: testing-securefix-server
          permission-issues: write
      - name: Execute selected runtime against the scratch repository
        id: execute
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_SERVER_APP_TOKEN: ${{ steps.server.outputs.token }}
          SECUREFIX_CLIENT_APP_TOKEN: ${{ steps.client.outputs.token }}
          SECUREFIX_TEST_WORKFLOW_SHA: ${{ job.workflow_sha }}
          SECUREFIX_PUBLISHED_RUNTIME_SHA: ${{ steps.producer.outputs.published_runtime_sha }}
          SECUREFIX_PUBLISHED_RUNTIME_TAG: ${{ steps.runtime.outputs.published_runtime_tag }}
          CANDIDATE_SHA: ${{ needs.build.outputs.source-sha }}
          TEST_PHASE: ${{ inputs.phase }}
          SECUREFIX_APPROVAL_FIXTURE_PR: ${{ inputs.approval_fixture_pr }}
          SECUREFIX_APPROVAL_FIXTURE_HEAD: ${{ inputs.approval_fixture_head }}
        run: |
          mkdir -p fixtures
          (cd fixtures && securefix integration run --phase "$TEST_PHASE" --candidate-sha "$CANDIDATE_SHA" --state-file state.json)
      - name: Revalidate baseline tag after candidate execution
        id: revalidate-runtime
        if: always() && steps.execute.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHED_RUNTIME_SHA: ${{ steps.producer.outputs.published_runtime_sha }}
          PUBLISHED_RUNTIME_TAG: ${{ steps.runtime.outputs.published_runtime_tag }}
        run: securefix integration resolve-test-runtime --published-runtime-sha "$PUBLISHED_RUNTIME_SHA" --expected-tag "$PUBLISHED_RUNTIME_TAG"
      - name: Validate scratch output files with selected runtime
        id: validate-outputs
        if: always() && steps.execute.outcome == 'success' && steps.revalidate-runtime.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.build.outputs.source-sha }}
          TEST_PHASE: ${{ inputs.phase }}
          SECUREFIX_PUBLISHED_RUNTIME_SHA: ${{ steps.producer.outputs.published_runtime_sha }}
          SECUREFIX_PUBLISHED_RUNTIME_TAG: ${{ steps.runtime.outputs.published_runtime_tag }}
        run: securefix integration validate-outputs --candidate-sha "$CANDIDATE_SHA" --phase "$TEST_PHASE" --state-file fixtures/state.json
      - name: Execute scratch control probe
        id: control-probe
        if: steps.validate-outputs.outcome == 'success'
        env:
          SECUREFIX_SERVER_APP_TOKEN: ${{ steps.server.outputs.token }}
          SECUREFIX_TEST_WORKFLOW_SHA: ${{ job.workflow_sha }}
          CANDIDATE_SHA: ${{ needs.build.outputs.source-sha }}
        run: |
          set -euo pipefail
          mkdir -p control-probe
          (cd control-probe && securefix integration control-probe --candidate-sha "$CANDIDATE_SHA" --state-file control-verification.json)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.control-probe.outcome == 'success'
        with:
          name: control-probe
          path: control-probe/control-verification.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.validate-outputs.outcome == 'success'
        with:
          name: scratch-fixtures
          path: |
            fixtures/state.json
            fixtures/verification.json
          if-no-files-found: error
          retention-days: 7

  managed-files-probe:
    needs: [baseline, build]
    if: inputs.phase == 'managed-files' && github.repository == 'civitaspo/securefix-server' && github.actor_id == '4525500' && github.run_attempt == 1 && (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/heads/integration/native-') && (inputs.candidate_sha == '' || inputs.candidate_sha == github.sha)))
    runs-on: ubuntu-24.04
    environment: main
    permissions:
      actions: read
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: civitaspo/securefix-server
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: candidate-runtime
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        with:
          binary: candidate-runtime/securefix
      - name: Validate the exact selected candidate before minting a writer token
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_TEST_BASELINE_SHA: ${{ needs.baseline.outputs.source-sha }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          CANDIDATE_SHA: ${{ needs.build.outputs.source-sha }}
          REQUESTED_SOURCE_SHA: ${{ inputs.candidate_sha }}
          CLIENT_REPOSITORY: ${{ inputs.client_repository }}
          CLIENT_IMPLEMENTATION_SHA: ${{ inputs.client_implementation_sha }}
          CLIENT_VERSION: ${{ inputs.client_version }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_SOURCE_SHA" ]]; then
            [[ "$CANDIDATE_SHA" == "$REQUESTED_SOURCE_SHA" ]] || { echo 'candidate binary source differs from the explicitly selected source' >&2; exit 1; }
          else
            [[ "$CANDIDATE_SHA" == "$WORKFLOW_SHA" ]] || { echo 'candidate binary source differs from the dispatched workflow revision' >&2; exit 1; }
          fi
          securefix integration validate-producer --workflow-sha "$WORKFLOW_SHA"
          [[ -n "$CLIENT_REPOSITORY" && -n "$CLIENT_IMPLEMENTATION_SHA" && -n "$CLIENT_VERSION" ]] || { echo 'owner-selected Client pin tuple is required for this scratch-only probe' >&2; exit 1; }
          securefix settings managed-validate-scratch --source-sha "$CANDIDATE_SHA" --client-repository "$CLIENT_REPOSITORY" --client-implementation-sha "$CLIENT_IMPLEMENTATION_SHA" --client-version "$CLIENT_VERSION"
      # This dedicated managed-file writer only gets repo-scoped permissions required
      # to create an exact reviewable workflow/config PR; settings administration is separate.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: managed-writer
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: testing-securefix-server
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Create the reviewable managed-file PR from the selected source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECUREFIX_SERVER_APP_TOKEN: ${{ steps.managed-writer.outputs.token }}
          SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
          CLIENT_REPOSITORY: ${{ inputs.client_repository }}
          CLIENT_IMPLEMENTATION_SHA: ${{ inputs.client_implementation_sha }}
          CLIENT_VERSION: ${{ inputs.client_version }}
        run: securefix settings managed-reconcile-scratch --source-sha "$SOURCE_SHA" --client-repository "$CLIENT_REPOSITORY" --client-implementation-sha "$CLIENT_IMPLEMENTATION_SHA" --client-version "$CLIENT_VERSION"

  provider-release-probe:
    if: inputs.phase == 'provider'
    uses: ./.github/workflows/testing-provider-release.yml
    permissions:
      actions: read
      contents: read
    secrets:
      TERRAFORM_PROVIDER_GPG_PRIVATE_KEY: ${{ secrets.TERRAFORM_PROVIDER_GPG_PRIVATE_KEY }}
      TERRAFORM_PROVIDER_GPG_PASSPHRASE: ${{ secrets.TERRAFORM_PROVIDER_GPG_PASSPHRASE }}
      SECUREFIX_SERVER_PRIVATE_KEY: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}

  native-release-assets-probe:
    if: inputs.phase == 'release-assets' && github.repository == 'civitaspo/securefix-server' && github.actor_id == '4525500' && github.run_attempt == 1 && startsWith(github.ref, 'refs/heads/integration/native-') && inputs.candidate_sha == github.sha
    uses: ./.github/workflows/testing-native-release-assets.yml
    permissions:
      actions: read
      contents: read
    secrets:
      SECUREFIX_SERVER_PRIVATE_KEY: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
