name: Test Candidate Runtime

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full reviewed candidate SHA; empty uses this workflow revision
        type: string
        default: ''
      phase:
        description: Prepare scratch fixtures or verify owner-authorized outcomes
        type: choice
        options: [prepare, verify]
        default: prepare
      fixture_run_id:
        description: Successful prepare run whose binary and state are reused
        type: string
        default: ''

permissions: {}

concurrency:
  group: candidate-integration
  cancel-in-progress: false

jobs:
  trusted-runtime-main:
    if: github.repository == 'civitaspo/securefix-server' && github.actor_id == '4525500' && github.run_attempt == 1 && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/load-cli.yml
    permissions:
      contents: read
      attestations: read

  trusted-build:
    if: github.repository == 'civitaspo/securefix-server' && github.actor_id == '4525500' && github.run_attempt == 1 && startsWith(github.ref, 'refs/heads/integration/native-') && (inputs.candidate_sha == '' || inputs.candidate_sha == github.sha)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: civitaspo/securefix-server
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-cli
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: trusted-runtime
          path: target/release/securefix
          if-no-files-found: error
          retention-days: 7

  build:
    if: github.repository == 'civitaspo/securefix-server' && github.actor_id == '4525500' && github.run_attempt == 1 && (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/heads/integration/native-') && (inputs.candidate_sha == '' || inputs.candidate_sha == github.sha))) && inputs.phase == 'prepare'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      source-sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          repository: civitaspo/securefix-server
          ref: ${{ inputs.candidate_sha || job.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-cli
      - name: Test candidate without credentials
        run: cargo +1.99.0 test --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: candidate-runtime
          path: target/release/securefix
          if-no-files-found: error
          retention-days: 7

  reuse:
    needs: [trusted-build, trusted-runtime-main]
    if: always() && github.repository == 'civitaspo/securefix-server' && github.actor_id == '4525500' && github.run_attempt == 1 && (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/heads/integration/native-') && (inputs.candidate_sha == '' || inputs.candidate_sha == github.sha))) && inputs.phase == 'verify' && (needs.trusted-build.result == 'success' || needs.trusted-runtime-main.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    timeout-minutes: 5
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      source-sha: ${{ inputs.candidate_sha || job.workflow_sha }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.trusted-runtime-main.outputs.artifact-id || needs.trusted-build.outputs.artifact-id }}
          path: trusted-runtime
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        with:
          binary: trusted-runtime/securefix
      - name: Validate producer and download candidate runtime
        id: state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || job.workflow_sha }}
          FIXTURE_RUN_ID: ${{ inputs.fixture_run_id }}
        run: $RUNNER_TEMP/securefix-bin/securefix integration fetch-state --candidate-sha "$CANDIDATE_SHA" --run-id "$FIXTURE_RUN_ID" --state-file fixtures/state.json
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ steps.state.outputs.candidate_artifact_id }}
          repository: civitaspo/securefix-server
          run-id: ${{ inputs.fixture_run_id }}
          github-token: ${{ github.token }}
          path: candidate-runtime
          merge-multiple: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: candidate-runtime
          path: candidate-runtime/securefix
          if-no-files-found: error
          retention-days: 7

  scratch:
    needs: [trusted-build, trusted-runtime-main, build, reuse]
    if: always() && github.repository == 'civitaspo/securefix-server' && github.actor_id == '4525500' && github.run_attempt == 1 && (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/heads/integration/native-') && (inputs.candidate_sha == '' || inputs.candidate_sha == github.sha))) && (needs.build.result == 'success' || needs.reuse.result == 'success') && (needs.trusted-build.result == 'success' || needs.trusted-runtime-main.result == 'success')
    runs-on: ubuntu-24.04
    environment: main
    permissions:
      actions: read
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        if: inputs.phase == 'prepare'
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: candidate-runtime
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        if: inputs.phase == 'prepare'
        with:
          binary: candidate-runtime/securefix
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        if: inputs.phase == 'verify'
        with:
          artifact-ids: ${{ needs.trusted-runtime-main.outputs.artifact-id || needs.trusted-build.outputs.artifact-id }}
          path: trusted-runtime
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        if: inputs.phase == 'verify'
        with:
          binary: trusted-runtime/securefix
      - name: Validate fixture state with trusted runtime
        if: inputs.phase == 'verify'
        id: state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.build.outputs.source-sha || inputs.candidate_sha || job.workflow_sha }}
          FIXTURE_RUN_ID: ${{ inputs.fixture_run_id }}
        run: $RUNNER_TEMP/securefix-bin/securefix integration fetch-state --candidate-sha "$CANDIDATE_SHA" --run-id "$FIXTURE_RUN_ID" --state-file fixtures/state.json
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        if: inputs.phase == 'verify'
        with:
          artifact-ids: ${{ needs.reuse.outputs.artifact-id }}
          path: candidate-runtime
          merge-multiple: true
      - uses: $/.github/actions/install-cli
        if: inputs.phase == 'verify'
        with:
          binary: candidate-runtime/securefix
      # The `main` environment must restrict access to main and the manually approved,
      # immutable integration/native-<workflow SHA prefix> bootstrap branch only.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: server
        with:
          app-id: '3872533'
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: testing-securefix-server
          permission-actions: read
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: client
        with:
          app-id: '3872492'
          private-key: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
          owner: civitaspo
          repositories: testing-securefix-server
          permission-issues: write
      - name: Execute candidate against the isolated scratch repository
        env:
          SECUREFIX_SERVER_TOKEN: ${{ steps.server.outputs.token }}
          SECUREFIX_CLIENT_TOKEN: ${{ steps.client.outputs.token }}
          SECUREFIX_TEST_WORKFLOW_SHA: ${{ job.workflow_sha }}
          CANDIDATE_SHA: ${{ needs.build.outputs.source-sha || needs.reuse.outputs.source-sha }}
          TEST_PHASE: ${{ inputs.phase }}
        run: securefix integration run --phase "$TEST_PHASE" --candidate-sha "$CANDIDATE_SHA" --state-file fixtures/state.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: scratch-fixtures
          path: fixtures/
          if-no-files-found: ignore
          retention-days: 7
