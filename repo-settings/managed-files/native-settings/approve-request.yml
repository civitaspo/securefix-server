name: testing-Approve Request

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  request:
    if: >-
      github.repository == 'civitaspo/testing-securefix-server' &&
      github.event.issue.pull_request &&
      github.event.comment.user.id == 4525500 &&
      github.event.comment.body == '/approve' &&
      github.run_attempt == 1
    uses: civitaspo/securefix-server/.github/workflows/reusable-client-request.yml@84f939b68b82de70554f98c429d65e077ef4a771 # v0.2.45-pre.116
    with:
      operation: approval
      server_repository: civitaspo/securefix-server
      instance_config_path: repo-settings/native-role-events-test-instance.toml
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
