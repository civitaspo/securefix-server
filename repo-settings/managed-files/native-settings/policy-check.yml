name: testing-Policy Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  check:
    if: github.repository == 'civitaspo/testing-securefix-server' && github.event.pull_request.base.repo.id == 1410312556 && (github.event.pull_request.user.id == 4525500 || github.event.pull_request.user.id == 288069019) && github.run_attempt == 1
    uses: civitaspo/securefix-server/.github/workflows/reusable-client-request.yml@e78897bdbf15e7abd0135a879b2774fcbb932091 # v0.2.45-pre.112
    with:
      operation: policy_check
      server_repository: civitaspo/securefix-server
      instance_config_path: repo-settings/native-role-events-test-instance.toml
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
