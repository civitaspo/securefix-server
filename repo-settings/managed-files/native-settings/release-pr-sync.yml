name: Release PR Sync

on:
  push:
    branches: ["release/next"]

permissions: {}
concurrency:
  group: release-pr-sync
  cancel-in-progress: false
jobs:
  sync:
    permissions:
      actions: read
      contents: read
      attestations: write
      pull-requests: write
    uses: civitaspo/securefix-server/.github/workflows/reusable-release-pr-sync.yml@c87a8977515a88c06480783933620d2a9dd32b9d # v0.2.45-pre.90
    with:
      server_repository: civitaspo/securefix-server
      instance_config_path: repo-settings/native-role-events-test-instance.toml
