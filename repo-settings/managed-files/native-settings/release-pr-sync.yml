name: Release PR Sync

on:
  push:
    branches: ["release/next"]

permissions: {}
concurrency:
  group: release-pr-sync
  cancel-in-progress: false
jobs:
  sync:
    permissions:
      actions: read
      contents: read
      attestations: write
      pull-requests: write
    uses: civitaspo/securefix-server/.github/workflows/reusable-release-pr-sync.yml@e78897bdbf15e7abd0135a879b2774fcbb932091 # v0.2.45-pre.112
    with:
      server_repository: civitaspo/securefix-server
      instance_config_path: repo-settings/native-role-events-test-instance.toml
