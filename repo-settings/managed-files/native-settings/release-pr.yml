name: Release PR

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      version:
        description: Explicit release version, or empty to compute it
        required: false
        type: string
        default: ""

permissions: {}
concurrency:
  group: release-pr
  cancel-in-progress: false
jobs:
  prepare:
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
    uses: civitaspo/securefix-server/.github/workflows/reusable-release-pr.yml@c87a8977515a88c06480783933620d2a9dd32b9d # v0.2.45-pre.90
    with:
      version: ${{ inputs.version || '' }}
      server_repository: civitaspo/securefix-server
      instance_config_path: repo-settings/native-role-events-test-instance.toml
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
