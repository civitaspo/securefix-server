name: testing-Native Securefix request

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions: {}

jobs:
  prepare-source:
    if: github.repository == 'civitaspo/testing-securefix-server' && github.event.pull_request.number == 432 && github.event.pull_request.base.repo.id == 1410312556 && github.event.pull_request.head.repo.id == 1410312556 && github.event.pull_request.user.id == 4525500 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.state == 'open' && github.actor_id == '4525500' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: read
      contents: read
    timeout-minutes: 10
    outputs:
      artifact-name: ${{ steps.source.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Format the existing PR fixture without signing credentials
        run: printf '%s\n' 'native pull_request Client proof fixture' > native-producer-proof.txt
      - name: Prepare and upload the credential-free Securefix artifact
        id: source
        uses: civitaspo/securefix-server/.github/actions/prepare-securefix@9d135f2ac6e0ba7312fcb8c344704abef3954d98 # v0.2.45-pre.114
        with:
          token: ${{ github.token }}
          files: native-producer-proof.txt
          commit-message: 'test: exercise ordinary pull_request Securefix'

  request:
    needs: prepare-source
    if: github.repository == 'civitaspo/testing-securefix-server' && github.event.pull_request.number == 432 && github.event.pull_request.base.repo.id == 1410312556 && github.event.pull_request.head.repo.id == 1410312556 && github.event.pull_request.user.id == 4525500 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.state == 'open' && github.actor_id == '4525500' && github.run_attempt == 1
    uses: civitaspo/securefix-server/.github/workflows/reusable-client-request.yml@9eabce19f60eac5eb281ec0e85abc9913b6d727a # v0.2.45-pre.121
    with:
      operation: securefix
      artifact_name: ${{ needs.prepare-source.outputs.artifact-name }}
      server_repository: civitaspo/securefix-server
      instance_config_path: repo-settings/native-role-events-test-instance.toml
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
