name: Securefix server Merge

on:
  label:
    types: [created]

permissions: {}

jobs:
  handler:
    concurrency:
      group: securefix-control
      cancel-in-progress: false
      queue: max
    if: startsWith(github.event.label.name, 'securefix-native-merge-')
    permissions:
      actions: read
      attestations: read
      contents: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
    uses: civitaspo/securefix-server/.github/workflows/reusable-server-merge.yml@7086c38f918c31f44eb6f63e34235477dd82fb8f # v0.2.45-pre.77 (candidate source)
    with:
      config_path: securefix-server.toml
    secrets:
      SERVER_PRIVATE_KEY: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
