name: Securefix server Policy Check

on:
  label:
    types: [created]

permissions: {}

jobs:
  handler:
    if: startsWith(github.event.label.name, 'securefix-native-policy-check-')
    permissions:
      actions: read
      attestations: read
      contents: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
    uses: civitaspo/securefix-server/.github/workflows/reusable-server-policy-check.yml@9eabce19f60eac5eb281ec0e85abc9913b6d727a # v0.2.45-pre.121
    with:
      config_path: securefix-server.toml
    secrets:
      SERVER_PRIVATE_KEY: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
