name: testing-Policy Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  check:
    if: github.repository == 'civitaspo/testing-securefix-server' && github.event.pull_request.base.repo.id == 1410312556 && github.event.pull_request.user.id == 4525500 && github.run_attempt == 1
    uses: civitaspo/securefix-server/.github/workflows/reusable-policy-check.yml@119643d5407f97b3589059246d43bd05590a248e # Admit exact scratch Server role receiver contexts
    with:
      server_repository: civitaspo/securefix-server
      instance_config_path: securefix-server.toml
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
