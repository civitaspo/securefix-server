name: Release PR

on:
  push:
    branches: ["@DEFAULT_BRANCH@"]
  workflow_dispatch:
    inputs:
      version:
        description: Explicit release version, or empty to compute it
        required: false
        type: string
        default: ""

permissions: {}
concurrency:
  group: release-pr
  cancel-in-progress: false
jobs:
  prepare:
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
    uses: @CLIENT_REPOSITORY@/.github/workflows/reusable-release-pr.yml@@CLIENT_IMPLEMENTATION_SHA@ # @CLIENT_IMPLEMENTATION_VERSION@
    with:
      version: ${{ inputs.version || '' }}
      server_repository: @SERVER_REPOSITORY@
      instance_config_path: @INSTANCE_CONFIG_PATH@
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
