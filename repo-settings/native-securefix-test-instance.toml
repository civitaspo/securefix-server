schema_version = 1
release_request_label_prefix = "testing-"

[instance]
repository = "civitaspo/securefix-server"
id = 1250079425
default_branch = "main"

[identities.owner]
login = "civitaspo"
id = 4525500

[identities.repository_owner]
login = "civitaspo"
id = 4525500

[identities.client_bot]
login = "civitaspo-securefix-client[bot]"
id = 288068203

[identities.server_bot]
login = "civitaspo-securefix-server[bot]"
id = 288069019

[identities.approval_reviewer]
login = "civitaspo-bot"
id = 308696683

[apps]
client_id = 3872492
server_id = 3872533
status_check_id = 15368
policy_check_id = 3872533

[workflow_roles]
approve = ".github/workflows/testing-native-approve.yml"
merge = ".github/workflows/testing-native-merge.yml"
policy_check = ".github/workflows/testing-native-policy-check-authority.yml"
securefix = ".github/workflows/testing-native-securefix-server.yml"

[policy]
trusted_committers = [
  "civitaspo",
  "civitaspo-securefix-server[bot]",
  "civitaspo-bot",
]
default_sensitive_paths = [
  ".github/workflows/**",
  ".github/actions/**",
  "**/Cargo.toml",
  "**/Cargo.lock",
]
merge_controls_enabled = false

[policy.sensitive_path_approval_exemptions]
users = []
github_apps = []

[[repositories]]
repository = "civitaspo/testing-securefix-server"
id = 1410312556
capabilities = ["approve", "merge", "securefix"]
protect_tags = false

[acceptable_clients]
repository = "civitaspo/securefix-server"
id = 1250079425
producer_workflow = ".github/workflows/request-producer-probe.yml"
version = ">=0.2.45-pre.23"

[[scratch_request_callers]]
repository = "civitaspo/testing-securefix-server"
id = 1410312556
workflow_path = ".github/workflows/policy-check.yml"
workflow_ref = "refs/heads/main"
event = "pull_request_target"
operation = "policy_check"
