# yaml-language-server: $schema=https://raw.githubusercontent.com/csm-actions/securefix-action/v0.6.0/json-schema/config.json
entries:
  - client:
      repositories:
        - "civitaspo/*"
      branches:
        - main
        - "**"
    push:
      repositories:
        - "civitaspo/*"
      branches:
        - "**"
    # Required to open/update release PRs (and any other Securefix-created PRs).
    pull_request: {}
