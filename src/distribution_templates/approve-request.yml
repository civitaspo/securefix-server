name: Approve Request

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  issue_comment:
    types:
      - created

permissions: {}

concurrency:
  group: approve-request-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.comment.id || github.run_id }}
  cancel-in-progress: true

jobs:
  approve:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       github.event.comment.user.id == @OWNER_ID@ &&
       contains(github.event.comment.body, '/approve'))
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
      issues: read
      pull-requests: read
    uses: @SERVER_REPOSITORY@/.github/workflows/reusable-approve-request.yml@@SECUREFIX_RUNTIME_SHA@ # @RUNTIME_VERSION@
    with:
      server_repository: @SERVER_REPOSITORY@
      instance_config_path: securefix-server.toml
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
