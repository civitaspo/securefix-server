name: Merge Request

on:
  issue_comment:
    types:
      - created

permissions: {}

concurrency:
  group: merge-request-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  request:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/merge') &&
      (github.event.comment.user.id == @OWNER_ID@ ||
       (github.event.comment.user.id == @RENOVATE_BOT_ID@ &&
        github.event.comment.user.type == 'Bot' &&
        github.event.issue.user.id == @RENOVATE_BOT_ID@)) &&
      github.run_attempt == 1
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
      issues: read
      pull-requests: read
    uses: @SERVER_REPOSITORY@/.github/workflows/reusable-merge-request.yml@@SECUREFIX_RUNTIME_SHA@ # @RUNTIME_VERSION@
    with:
      server_repository: @SERVER_REPOSITORY@
      instance_config_path: securefix-server.toml
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
