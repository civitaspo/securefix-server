name: Policy Check

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

concurrency:
  group: policy-check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
      issues: read
      pull-requests: read
    uses: @SERVER_REPOSITORY@/.github/workflows/reusable-policy-check.yml@@SECUREFIX_RUNTIME_SHA@ # @RUNTIME_VERSION@
    with:
      server_repository: @SERVER_REPOSITORY@
      instance_config_path: securefix-server.toml
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
