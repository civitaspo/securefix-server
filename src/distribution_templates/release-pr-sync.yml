name: Release PR Sync

on:
  push:
    branches: [release/next]

permissions: {}

concurrency:
  group: release-pr-sync
  cancel-in-progress: true

jobs:
  sync:
    permissions:
      actions: read
      contents: read
      attestations: read
      pull-requests: write
    uses: @SERVER_REPOSITORY@/.github/workflows/reusable-release-pr-sync.yml@@SECUREFIX_RUNTIME_SHA@ # @RUNTIME_VERSION@
    with:
      server_repository: @SERVER_REPOSITORY@
      instance_config_path: securefix-server.toml
