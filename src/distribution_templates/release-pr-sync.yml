name: Release PR Sync

on:
  push:
    branches:
      - @RELEASE_BRANCH@
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-pr-sync
  cancel-in-progress: true

jobs:
  sync:
    permissions:
      contents: read
      attestations: read
      pull-requests: write
    uses: @SERVER_REPOSITORY@/.github/workflows/reusable-release-pr-sync.yml@@SECUREFIX_RUNTIME_SHA@ # @RUNTIME_VERSION@
