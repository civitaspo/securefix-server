name: Release PR

on:
  push:
    branches:
      - @DEFAULT_BRANCH@
  workflow_dispatch:
    inputs:
      version:
        description: Explicit release version, or empty to compute it
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  prepare:
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
      pull-requests: read
    uses: @SERVER_REPOSITORY@/.github/workflows/reusable-release-pr.yml@@SECUREFIX_RUNTIME_SHA@ # @RUNTIME_VERSION@
    with:
      version: ${{ inputs.version || '' }}
      server_repository: @SERVER_REPOSITORY@
      instance_config_path: securefix-server.toml
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
