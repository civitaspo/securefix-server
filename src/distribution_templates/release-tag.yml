name: Release Tag

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      release_pr_number:
        description: Merged @RELEASE_BRANCH@ PR to retry
        required: true
        type: number

permissions: {}

concurrency:
  group: release-tag-${{ github.event.pull_request.number || inputs.release_pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged && github.event.pull_request.head.ref == '@RELEASE_BRANCH@' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: write
      attestations: read
      pull-requests: read
      issues: write
    uses: @SERVER_REPOSITORY@/.github/workflows/reusable-release-tag.yml@@SECUREFIX_RUNTIME_SHA@ # @RUNTIME_VERSION@
    with:
      release_pr_number: ${{ inputs.release_pr_number || github.event.pull_request.number || 0 }}
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
