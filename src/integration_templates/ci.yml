name: Scratch CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  status-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate fixture diff
        run: git diff --check HEAD^ HEAD
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.10.4'
          install: false
          cache: false
      - name: Verify action pins and their version comments
        env:
          PINACT_GITHUB_TOKEN: ${{ github.token }}
        run: mise exec aqua:suzuki-shunsuke/pinact@5.0.0 -- pinact run --verify-comment
      - name: Require pins to be current without automatic modifications
        run: git diff --exit-code
