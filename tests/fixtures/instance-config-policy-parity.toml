schema_version = 1
release_request_label_prefix = ""

[instance]
repository = "example-org/controller"
id = 404
default_branch = "trunk"

[identities.owner]
login = "maintainer"
id = 101

[identities.repository_owner]
login = "example-org"
id = 406

[identities.client_bot]
login = "example-client[bot]"
id = 202

[identities.server_bot]
login = "example-server[bot]"
id = 303

[identities.approval_reviewer]
login = "reviewer"
id = 601

[identities.renovate_merge_bot]
login = "example-renovate[bot]"
id = 603

[apps]
client_id = 501
server_id = 502
status_check_id = 701
policy_check_id = 502

[workflow_roles]
approve = ".github/workflows/approve.yml"
merge = ".github/workflows/merge.yml"
policy_check = ".github/workflows/policy-check.yml"
release = ".github/workflows/release.yml"
securefix = ".github/workflows/securefix.yml"

[branches]
release = "releases/candidate"

[policy]
trusted_committers = [
  "maintainer",
  "example-server[bot]",
  "automation-reviewer",
  "example-renovate[bot]",
  "renovate[bot]",
  "dependabot[bot]",
]
default_sensitive_paths = [
  ".github/workflows/**",
  ".github/actions/**",
  "**/Cargo.toml",
  "**/Cargo.lock",
  "**/go.mod",
  "**/go.sum",
  "**/package.json",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/yarn.lock",
  "**/pyproject.toml",
  "**/uv.lock",
  "**/requirements*.txt",
  "**/mise.toml",
  "**/.mise.toml",
  "**/mise.lock",
  "**/.mise.lock",
  "**/Makefile",
  "**/Dockerfile*",
  ".goreleaser.*",
  "scripts/**",
  "**/build.rs",
  ".cargo/**",
  "**/.cargo/**",
]
merge_controls_enabled = true

[policy.sensitive_path_approval_exemptions]
users = [{ id = 602, login = "automation-reviewer" }]
github_apps = [{ bot_id = 603, bot_login = "example-renovate[bot]" }]

[[repositories]]
repository = "example-org/project"
id = 987654
capabilities = ["approve", "merge", "securefix", "release", "settings"]
release = "github-release"
protect_tags = true

[acceptable_clients]
repository = "client-org/securefix-client"
id = 654321
producer_workflow = ".github/workflows/request-producer.yml"
version = ">=1.4.0"
