name: testing-Policy Check Request Producer

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  produce:
    if: github.repository == 'civitaspo/testing-securefix-server' && github.event.pull_request.base.repo.id == 1410312556 && github.event.pull_request.user.id == 4525500 && github.run_attempt == 1
    uses: civitaspo/securefix-server/.github/workflows/request-producer-probe.yml@bf200655844cd60003b8cd612715db6b6d025310 # reviewed helper workflow source commit
    with:
      operation: policy_check
      candidate_run_id: "39803448159"
      candidate_source_sha: 5cca7b5f28c5f08750525347b5b81f0869380e9d
      pull_request_number: ${{ format('{0}', github.event.pull_request.number) }}
      server_repository: civitaspo/securefix-server
      instance_config_path: repo-settings/native-securefix-test-instance.toml
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      issues: read
      pull-requests: read
